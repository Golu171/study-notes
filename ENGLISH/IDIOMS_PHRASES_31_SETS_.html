<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IDIOMS & PHRASES</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Poppins,Arial,sans-serif}
body{background:#f3f6fb;color:#172033;padding:12px 10px 30px}
.wrap{max-width:900px;margin:auto}
.top{background:#205e61;color:#fff;border-radius:22px;padding:15px;box-shadow:0 9px 24px rgba(25,48,70,.16)}
.toprow{display:flex;justify-content:space-between;gap:9px}
.btn{border:0;border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
h1{margin:15px 0 3px;font-size:28px;font-weight:900}
.sub{margin:0;font-size:14px;opacity:.92}
.search{width:100%;margin-top:14px;padding:12px 14px;border:0;border-radius:13px;outline:0;font-size:15px;background:#fff;color:#172033}
h2{margin:27px 2px 12px;padding-left:14px;position:relative;font-size:24px;color:#596276;font-weight:900}
h2:before{content:"";position:absolute;left:0;top:2px;width:5px;height:23px;border-radius:5px;background:#4c8f92}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{min-height:150px;border-radius:21px;padding:18px 15px;border:1.5px solid rgba(91,111,130,.28);box-shadow:0 4px 12px rgba(40,55,75,.08);cursor:pointer;text-decoration:none;color:#182034;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;transition:transform .12s ease}
.card:active{transform:scale(.975)}
.card:nth-child(6n+1){background:#d9e8e9}
.card:nth-child(6n+2){background:#d9dce8}
.card:nth-child(6n+3){background:#d5e8df}
.card:nth-child(6n+4){background:#ddd9eb}
.card:nth-child(6n+5){background:#dce9d7}
.card:nth-child(6n+6){background:#e0d6e5}
.card-icon{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);border:1px solid rgba(90,115,130,.12);margin-bottom:14px;color:#3d7377}
.card-icon svg{width:33px;height:33px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:17px;line-height:1.25;font-weight:900;word-break:break-word}
.file{margin-top:6px;font-size:11px;color:#7d8795;line-height:1.25}
.empty{grid-column:1/-1;background:#fff;padding:20px;border-radius:18px;color:#687386}
.viewer{display:none;position:fixed;inset:0;background:#fff;z-index:9999}
.viewerbar{height:54px;background:#205e61;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px}
.viewerbar button{border:0;border-radius:10px;background:rgba(255,255,255,.17);color:#fff;padding:8px 11px;font-size:14px;font-weight:700}
.viewerbar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:800}
.quiz{display:none;position:fixed;inset:0;background:#f3f6fb;z-index:10000;overflow:auto;padding:12px 10px 30px}
.quiz-wrap{max-width:900px;margin:auto}
.quiz-top{background:#205e61;color:#fff;border-radius:22px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:2}
.quiz-title{font-weight:900;font-size:14px}
.qbox{background:#fff;border:1.5px solid rgba(91,111,130,.28);border-radius:18px;padding:16px;margin-top:12px;font-size:18px;font-weight:800;line-height:1.5;box-shadow:0 4px 12px rgba(40,55,75,.08)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.opt{border:1.5px solid rgba(91,111,130,.28);background:#fff;border-radius:15px;padding:13px 14px;text-align:left;font-size:15px;font-weight:700;cursor:pointer;color:#172033}
.opt.correct{background:#d9f2e4;border-color:#15945b;color:#075b38}
.opt.wrong{background:#f8dfe3;border-color:#d64b5c;color:#8d1827}
.exp{display:none;background:#fff;border:1.5px solid #4c8f92;border-radius:15px;padding:13px;margin-top:12px;line-height:1.55;font-size:14px}
.actions{display:flex;gap:10px;margin-top:12px}
.action{flex:1;border:0;border-radius:13px;padding:12px;background:#205e61;color:#fff;font-weight:800;cursor:pointer}
.action.next{background:#4c8f92}
.result{display:none;margin-top:14px;background:#fff;border-radius:20px;border:1.5px solid rgba(91,111,130,.28);padding:25px;text-align:center}
.result-score{font-size:36px;font-weight:900;color:#205e61}
@media(max-width:600px){
  h1{font-size:27px} .title{font-size:16px} .card{min-height:148px;padding:18px 14px}
}
</style>
</head>
<body>
<div class="wrap" id="mainPage">
  <div class="top">
    <div class="toprow">
      <button class="btn" onclick="goBack()">← Home</button>
      <button class="btn" onclick="toggleFull()">⛶ Full Screen</button>
    </div>
    <h1 id="heading">📚 IDIOMS & PHRASES</h1>
    <p id="sub" class="sub">सभी Idioms & Phrases Practice Sets यहाँ मिलेंगे</p>
    <input id="search" class="search" type="search" placeholder="🔎 Set खोजें..." oninput="filterSets()">
  </div>

  <h2>अभ्यास</h2>
  <div id="items" class="grid"></div>
</div>

<div id="quiz" class="quiz">
  <div class="quiz-wrap">
    <div class="quiz-top">
      <button class="btn" onclick="closeQuiz()">← Sets</button>
      <div id="quizTitle" class="quiz-title">Set 1</div>
      <button class="btn" onclick="toggleFull()">⛶</button>
    </div>
    <div id="counter" class="qbox" style="font-size:13px;padding:10px 13px;margin-top:10px"></div>
    <div id="question" class="qbox">Loading...</div>
    <div id="options" class="opts"></div>
    <div id="explanation" class="exp"></div>
    <div class="actions">
      <button class="action" onclick="prevQuestion()">← Previous</button>
      <button class="action next" onclick="nextQuestion()">Next Question →</button>
    </div>
    <div id="result" class="result">
      <div style="font-size:14px;font-weight:800">Practice Completed</div>
      <div id="resultScore" class="result-score">0/0</div>
      <div id="resultStats"></div>
      <button class="action" style="margin-top:15px" onclick="restartSet()">🔄 Reattempt Set</button>
    </div>
  </div>
</div>

/* SET LIST — index.html के उसी 2-column card layout के अनुसार */
let currentSetId = "Set-1";
let currentQuestions = [];
let currentIndex = 0;
let userAnswers = {};
let setList = Array.from({length:31}, (_,i) => "Set-" + (i+1));

function bookIcon(){
  return `<svg viewBox="0 0 48 48">
    <path d="M8 10.5c6.5-2.2 11.8-.9 16 2.8v25.2c-4.2-3.7-9.5-5-16-2.8z"/>
    <path d="M40 10.5c-6.5-2.2-11.8-.9-16 2.8v25.2c-4.2-3.7-9.5-5-16-2.8z"/>
    <path d="M24 13.3v25.2"/>
  </svg>`;
}

function renderSets(list=setList){
  const box=document.getElementById("items");
  box.innerHTML="";
  list.forEach(setId=>{
    const n=parseInt(setId.replace("Set-",""));
    const count=ALL_DATA.filter(q=>q.level===setId).length;
    const d=document.createElement("div");
    d.className="card";
    d.onclick=()=>startSet(setId);
    d.innerHTML=
      '<div class="card-icon">'+bookIcon()+'</div>'+
      '<div class="title">📚 '+setId+' — Idioms & Phrases</div>'+
      '<div class="file">'+(count || 50)+' Questions</div>';
    box.appendChild(d);
  });
}

function filterSets(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  renderSets(setList.filter(s=>s.toLowerCase().includes(q)));
}

function startSet(setId){
  currentSetId=setId;
  currentQuestions=ALL_DATA.filter(q=>q.level===setId);
  if(!currentQuestions.length){ alert(setId+" ke questions nahi mile."); return; }
  currentIndex=0;
  userAnswers={};
  document.getElementById("quizTitle").textContent="📚 "+setId+" — Idioms & Phrases";
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";
  window.scrollTo(0,0);
  loadQuestion(0);
}

function loadQuestion(idx){
  currentIndex=idx;
  const q=currentQuestions[idx];
  document.getElementById("counter").textContent=`Question ${idx+1} / ${currentQuestions.length}`;
  document.getElementById("question").textContent=q.question;
  const box=document.getElementById("options");
  box.innerHTML="";
  q.options.forEach((optText,optIdx)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<b>${String.fromCharCode(65+optIdx)}.</b> ${optText.replace(/^\([a-d]\)\s*/i,"")}`;
    if(userAnswers[idx]!==undefined){
      b.disabled=true;
      if(optIdx===q.answerIndex)b.classList.add("correct");
      if(userAnswers[idx]===optIdx && optIdx!==q.answerIndex)b.classList.add("wrong");
    }else b.onclick=()=>selectOption(optIdx);
    box.appendChild(b);
  });
  const exp=document.getElementById("explanation");
  if(userAnswers[idx]!==undefined){
    exp.innerHTML=q.explanation || "No explanation provided.";
    exp.style.display="block";
  }else{
    exp.style.display="none";
  }
  document.getElementById("result").style.display="none";
}

function selectOption(i){
  if(userAnswers[currentIndex]!==undefined)return;
  userAnswers[currentIndex]=i;
  loadQuestion(currentIndex);
}

function prevQuestion(){
  if(currentIndex>0)loadQuestion(currentIndex-1);
}
function nextQuestion(){
  if(currentIndex<currentQuestions.length-1)loadQuestion(currentIndex+1);
  else showResults();
}
function showResults(){
  let correct=0,wrong=0;
  currentQuestions.forEach((q,i)=>{
    if(userAnswers[i]===q.answerIndex)correct++;
    else if(userAnswers[i]!==undefined)wrong++;
  });
  document.getElementById("resultScore").textContent=correct+"/"+currentQuestions.length;
  document.getElementById("resultStats").textContent=
    "✅ Correct: "+correct+" | ❌ Wrong: "+wrong+
    " | ⏳ Skipped: "+(currentQuestions.length-correct-wrong);
  document.getElementById("result").style.display="block";
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function restartSet(){
  startSet(currentSetId);
}
function closeQuiz(){
  document.getElementById("quiz").style.display="none";
  renderSets();
}
function toggleFull(){
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>{});
}
function goBack(){
  if(document.referrer)history.back();
  else location.href="../index.html";
}

renderSets();
</script>
