<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGLISH - Tests</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#f3f6fb;color:#172033;padding:18px 14px 35px}
.container{max-width:900px;margin:auto}
.top{
  background:linear-gradient(135deg,#0f9d58,#087f46);
  color:#fff;border-radius:20px;padding:18px;
  box-shadow:0 8px 22px rgba(0,0,0,.14)
}
.toprow{display:flex;gap:10px;justify-content:space-between;align-items:center}
.back,.full{
  border:0;text-decoration:none;color:#fff;background:rgba(255,255,255,.18);
  padding:9px 13px;border-radius:10px;font-size:16px;cursor:pointer
}
h1{margin:18px 0 5px;font-size:29px}
.sub{margin:0;opacity:.94;font-size:15px}
.search{width:100%;margin-top:16px;padding:13px 14px;border:0;outline:0;border-radius:12px;font-size:16px}
h2{margin:24px 2px 12px;font-size:21px}
#status{background:#fff;padding:13px;border-radius:12px;color:#5d6678;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.grid{display:grid;gap:12px}
.card{
  display:block;text-decoration:none;color:#172033;background:#fff;border-radius:15px;
  padding:15px 16px;border:1px solid #e4e8ef;box-shadow:0 3px 10px rgba(0,0,0,.06);
  cursor:pointer
}
.title{font-size:17px;font-weight:700}
.file{font-size:12px;color:#778095;margin-top:6px;word-break:break-all}
.viewer{display:none;margin-top:14px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.12)}
.viewerbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:#172033;color:#fff}
.viewerbar button{border:0;border-radius:9px;padding:8px 11px;cursor:pointer}
#testFrame{display:block;width:100%;height:calc(100vh - 95px);min-height:600px;border:0;background:#fff}
.dark{background:#111827;color:#e8edf7}
.dark .card,.dark #status{background:#1b2433;color:#e8edf7;border-color:#303b4d}
.dark .file{color:#aab4c5}
.dark .search{background:#1b2433;color:#fff}
.dark .viewer{background:#1b2433}
body.fs{padding:0}
body.fs .container{max-width:none}
body.fs .top{display:none}
body.fs #listArea{display:none}
body.fs .viewer{display:block;margin:0;border-radius:0;box-shadow:none}
body.fs #testFrame{height:calc(100vh - 51px);min-height:0}
@media(max-width:600px){
  body{padding:12px}
  h1{font-size:27px}
  #testFrame{min-height:70vh}
}
</style>
</head>
<body>
<div class="container">

<div class="top">
  <div class="toprow">
    <a class="back" href="../index.html">← Home</a>
    <button class="full" onclick="toggleFull()">⛶ Full Screen</button>
  </div>
  <h1>📚 ENGLISH</h1>
  <p class="sub">Black Book और Volume 1 के सभी HTML Tests यहाँ मिलेंगे</p>
  <input id="search" class="search" type="search" placeholder="🔎 Test खोजें..." oninput="filterTests()">
</div>

<div id="listArea">
  <h2>📁 Available Tests</h2>
  <div id="status">Tests की सूची लोड हो रही है...</div>
  <div id="tests" class="grid"></div>
</div>

<div id="viewer" class="viewer">
  <div class="viewerbar">
    <button onclick="closeTest()">← Tests</button>
    <span id="viewerTitle">Test</span>
    <button onclick="toggleFull()">⛶</button>
  </div>
  <iframe id="testFrame" allowfullscreen></iframe>
</div>

</div>

<script>
const OWNER="Golu171", REPO="study-notes", FOLDER="ENGLISH", BRANCH="main";
let allTests=[];

async function loadTests(){
  const status=document.getElementById("status");
  try{
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`,
      {headers:{"Accept":"application/vnd.github+json"}});
    if(!r.ok) throw new Error();
    const files=await r.json();

    allTests=files
      .filter(x=>x.type==="file" &&
        x.name.toLowerCase().endsWith(".html") &&
        x.name.toLowerCase()!=="index.html")
      .sort((a,b)=>a.name.localeCompare(b.name,undefined,
        {numeric:true,sensitivity:"base"}));

    status.textContent=`${allTests.length} HTML Test${allTests.length===1?"":"s"} मिले`;
    renderTests(allTests);
  }catch(e){
    status.textContent="Tests की सूची लोड नहीं हो पाई। थोड़ी देर बाद फिर खोलें।";
  }
}

function renderTests(files){
  const box=document.getElementById("tests");
  box.innerHTML="";
  if(!files.length){
    box.innerHTML='<div class="card">अभी कोई HTML Test नहीं मिला।</div>';
    return;
  }

  files.forEach(file=>{
    const a=document.createElement("div");
    a.className="card";
    a.onclick=()=>openTest(file);
    a.innerHTML=
      `<div class="title">📝 ${esc(clean(file.name))}</div>
       <div class="file">${esc(file.name)}</div>`;
    box.appendChild(a);
  });
}

function openTest(file){
  document.getElementById("testFrame").src="./"+encodeURIComponent(file.name);
  document.getElementById("viewerTitle").textContent=clean(file.name);
  document.getElementById("viewer").style.display="block";
  document.getElementById("listArea").style.display="none";

  document.body.classList.add("fs");
  if(document.documentElement.requestFullscreen){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
}

function closeTest(){
  document.body.classList.remove("fs");
  document.getElementById("viewer").style.display="none";
  document.getElementById("listArea").style.display="block";
  document.getElementById("testFrame").src="";
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
}

function toggleFull(){
  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
    document.body.classList.remove("fs");
  }else{
    document.documentElement.requestFullscreen().then(()=>{
      document.body.classList.add("fs");
    }).catch(()=>{
      document.body.classList.toggle("fs");
    });
  }
}

function filterTests(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  renderTests(allTests.filter(x=>x.name.toLowerCase().includes(q)));
}
function clean(n){
  return n.replace(/\.html$/i,"").replace(/[_-]+/g," ").replace(/\s+/g," ").trim();
}
function esc(t){
  const d=document.createElement("div");
  d.textContent=t;
  return d.innerHTML;
}

loadTests();
</script>
</body>
</html>
