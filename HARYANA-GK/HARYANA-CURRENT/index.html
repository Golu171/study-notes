<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HARYANA CURRENT</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#f3f6fb;
  color:#172033;
}

.wrap{
  max-width:900px;
  margin:auto;
}

/* TOP */

.top{
  background:linear-gradient(135deg,#0f9d58,#087f46);
  color:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 22px #0002;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:9px 13px;
  background:#ffffff2b;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

h1{
  margin:18px 0 5px;
  font-size:29px;
}

.sub{
  margin:0;
}

.search{
  width:100%;
  margin-top:16px;
  padding:13px;
  border:0;
  border-radius:12px;
  font-size:16px;
  outline:0;
}

/* AVAILABLE */

h2{
  font-size:21px;
  margin:24px 2px 12px;
}

#status{
  color:#687386;
  margin-bottom:14px;
}

.grid{
  display:grid;
  gap:12px;
}

/* CARDS */

.card{
  background:#fff;
  border-radius:18px;
  padding:17px;
  box-shadow:0 4px 14px #14233c14;
  cursor:pointer;
  display:block;
  text-decoration:none;
  color:inherit;
}

.card:active{
  transform:scale(.99);
}

.title{
  font-size:19px;
  font-weight:bold;
}

.file{
  font-size:14px;
  color:#788393;
  margin-top:6px;
}

.folder .title{
  color:#087f46;
}

.empty{
  background:#fff;
  padding:20px;
  border-radius:18px;
  color:#687386;
}

/* TEST VIEWER */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
}

.viewerbar{
  height:54px;
  background:#087f46;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:10px;
  padding:8px 12px;
}

.viewerbar span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;

  font-weight:bold;
  flex:1;
  text-align:center;
}

iframe{
  width:100%;
  height:calc(100vh - 54px);
  border:0;
}

/* DARK MODE */

body.dark{
  background:#111827;
  color:#e5e7eb;
}

body.dark #status{
  color:#aab3c2;
}

body.dark .card,
body.dark .empty{
  background:#1f2937;
  color:#e5e7eb;
}

body.dark .file{
  color:#aab3c2;
}

/* MOBILE */

@media(max-width:600px){

  body{
    padding:10px;
  }

  h1{
    font-size:27px;
  }

  .title{
    font-size:18px;
  }

  .sub{
    font-size:14px;
  }

  button{
    font-size:14px;
    padding:8px 10px;
  }

}

</style>
</head>


<body>

<div class="wrap">

  <!-- TOP SECTION -->

  <div class="top">

    <div class="row">

      <button onclick="goBack()">
        ← Back
      </button>

      <div style="display:flex;gap:8px;">

        <button onclick="toggleDark()">
          🌙
        </button>

        <button onclick="fullScreen()">
          ⛶ Full Screen
        </button>

      </div>

    </div>


    <h1>
      📚 HARYANA CURRENT
    </h1>


    <p class="sub">
      सभी Haryana Current Affairs HTML Tests यहाँ मिलेंगे
    </p>


    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Test या Folder खोजें..."
      oninput="searchItems()"
    >

  </div>


  <!-- AVAILABLE -->

  <h2>
    📁 Available
  </h2>


  <div id="status">
    Loading...
  </div>


  <div id="items" class="grid"></div>

</div>


<!-- TEST VIEWER -->

<div id="viewer" class="viewer">

  <div class="viewerbar">

    <button onclick="closeTest()">
      ← Tests
    </button>


    <span id="viewerTitle">
      Test
    </span>


    <button onclick="fullScreen()">
      ⛶
    </button>

  </div>


  <iframe
    id="frame"
    allowfullscreen>
  </iframe>

</div>


<script>

/* =================================
   GITHUB SETTINGS
================================= */

const OWNER = "Golu171";

const REPO = "study-notes";

const ROOT = "HARYANA-GK/HARYANA-CURRENT";

const BRANCH = "main";


/* =================================
   DATA
================================= */

let folders = [];

let files = [];


/* =================================
   GITHUB API
================================= */

function api(path){

  return "https://api.github.com/repos/"
    + OWNER
    + "/"
    + REPO
    + "/contents/"
    + path
        .split("/")
        .map(encodeURIComponent)
        .join("/")
    + "?ref="
    + BRANCH;

}


/* =================================
   CLEAN NAME
================================= */

function clean(name){

  return name
    .replace(/\.(html|json)$/i,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =================================
   SAFE TEXT
================================= */

function esc(text){

  const d =
    document.createElement("div");

  d.textContent = text;

  return d.innerHTML;

}


/* =================================
   SORT
================================= */

function sortName(a,b){

  return a.name.localeCompare(
    b.name,
    undefined,
    {
      numeric:true,
      sensitivity:"base"
    }
  );

}


/* =================================
   LOAD GITHUB FILES
================================= */

async function load(){

  const status = document.getElementById("status");
  const box = document.getElementById("items");

  status.textContent = "Files load हो रहे हैं...";

  try{

    /*
      Git Trees API:
      इससे current main branch की पूरी tree मिलती है।
      हम केवल HARYANA-CURRENT के direct folders/files लेते हैं।
      JSON और HTML दोनों निश्चित रूप से मिलेंगे।
    */

    const treeUrl =
      "https://api.github.com/repos/" +
      OWNER + "/" + REPO +
      "/git/trees/" + BRANCH +
      "?recursive=1&_=" + Date.now();

    const controller = new AbortController();
    const timer = setTimeout(
      () => controller.abort(),
      15000
    );

    let data;

    try{

      const r = await fetch(
        treeUrl,
        {
          cache: "no-store",
          headers: {
            "Accept": "application/vnd.github+json"
          },
          signal: controller.signal
        }
      );

      if(!r.ok){
        throw new Error("GitHub API " + r.status);
      }

      data = await r.json();

    }finally{

      clearTimeout(timer);

    }

    if(
      !data ||
      !Array.isArray(data.tree)
    ){

      throw new Error("Unexpected GitHub tree response");

    }

    const prefix = ROOT + "/";

    folders = data.tree
      .filter(x =>
        x.type === "tree" &&
        x.path.startsWith(prefix) &&
        !x.path.slice(prefix.length).includes("/")
      )
      .map(x => ({
        type: "dir",
        name: x.path.slice(prefix.length),
        path: x.path
      }))
      .sort(sortName);

    files = data.tree
      .filter(x => {

        if(
          x.type !== "blob" ||
          !x.path.startsWith(prefix)
        ) return false;

        const name =
          x.path.slice(prefix.length);

        if(name.includes("/")) return false;

        if(
          name.toLowerCase() === "index.html" ||
          name.toLowerCase() === "json-viewer.html"
        ) return false;

        return (
          /\.html$/i.test(name) ||
          /\.json$/i.test(name)
        );

      })
      .map(x => ({
        type: "file",
        name: x.path.slice(prefix.length),
        path: x.path
      }))
      .sort(sortName);

    status.textContent =
      folders.length +
      " Folder" +
      (folders.length === 1 ? "" : "s") +
      " + " +
      files.length +
      " Test file" +
      (files.length === 1 ? "" : "s") +
      " मिले";

    render();

  }catch(e){

    console.error(
      "Current listing failed:",
      e
    );

    status.textContent =
      "Files load नहीं हो पाईं";

    box.innerHTML =
      '<div class="empty">' +
      'GitHub listing अभी load नहीं हुई। Refresh करके फिर देखें।' +
      '</div>';

  }

}

/* =================================
   RENDER
================================= */

function render(){

  const box =
    document.getElementById("items");


  box.innerHTML = "";


  /* =================================
     FOLDERS
  ================================= */

  folders.forEach(folder => {

    const a =
      document.createElement("a");


    a.className =
      "card folder";


    /*
      EXACT FOLDER PATH
    */

    a.href =
      "/" +
      REPO +
      "/" +
      folder.path
        .split("/")
        .map(encodeURIComponent)
        .join("/")
      +
      "/";


    a.innerHTML =
      '<div class="title">' +
      '📁 ' +
      esc(clean(folder.name)) +
      '</div>' +

      '<div class="file">' +
      'Folder खोलें →' +
      '</div>';


    box.appendChild(a);

  });


  /* =================================
     HTML TESTS
  ================================= */

  files.forEach(file => {

    const d =
      document.createElement("div");


    d.className =
      "card";


    /*
      IMPORTANT:
      पूरा PATH भेजना है,
      सिर्फ file.name नहीं
    */

    d.onclick =
      () => openTest(file.path);


    const isJson = /\.json$/i.test(file.name);

    d.innerHTML =
      '<div class="title">' +
      (isJson ? '🧩 ' : '📝 ') +
      esc(clean(file.name)) +
      '</div>' +

      '<div class="file">' +
      esc(file.name) +
      '</div>';


    box.appendChild(d);

  });


  /* EMPTY */

  if(
    !folders.length &&
    !files.length
  ){

    box.innerHTML =
      '<div class="empty">' +
      'अभी कोई Test या Folder नहीं मिला।' +
      '</div>';

  }

}


/* =================================
   SEARCH
================================= */

function searchItems(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const oldFolders =
    folders;

  const oldFiles =
    files;


  folders =
    oldFolders.filter(
      x =>
        x.name
          .toLowerCase()
          .includes(q)
    );


  files =
    oldFiles.filter(
      x =>
        x.name
          .toLowerCase()
          .includes(q)
    );


  render();


  folders =
    oldFolders;

  files =
    oldFiles;

}


/* =================================
   OPEN TEST
================================= */

function openTest(path){

  const encodedPath =
    path.split("/").map(part => encodeURIComponent(part)).join("/");

  const isJson = /\.json$/i.test(path);

  let url;

  if (isJson) {
    // Reusable JSON viewer. The viewer loads the JSON file and uses the original test UI.
    const viewerPath =
      location.origin +
      "/" +
      REPO +
      "/HARYANA-GK/HARYANA-CURRENT/JSON-VIEWER.html";

    url =
      viewerPath +
      "?file=" +
      encodeURIComponent(path) +
      "&v=" +
      Date.now();
  } else {
    url =
      location.origin + "/" + REPO + "/" + encodedPath;
  }

  console.log("Opening:", url);

  document.getElementById("frame").src = url;

  document.getElementById("viewerTitle").textContent =
    clean(path.split("/").pop());

  document.getElementById("viewer").style.display = "block";
}



/* =================================
   CLOSE TEST
================================= */

function closeTest(){

  document
    .getElementById("viewer")
    .style.display =
      "none";


  document
    .getElementById("frame")
    .src = "";

}


/* =================================
   FULL SCREEN
================================= */

function fullScreen(){

  if(
    !document.fullscreenElement
  ){

    document
      .documentElement
      .requestFullscreen?.()
      .catch(
        ()=>{}
      );

  }

  else{

    document
      .exitFullscreen?.()
      .catch(
        ()=>{}
      );

  }

}


/* =================================
   DARK MODE
================================= */

function toggleDark(){

  document
    .body
    .classList
    .toggle("dark");


  localStorage.setItem(
    "darkMode",

    document.body.classList.contains(
      "dark"
    )
      ? "1"
      : "0"
  );

}


/* =================================
   LOAD DARK MODE
================================= */

if(
  localStorage.getItem(
    "darkMode"
  ) === "1"
){

  document
    .body
    .classList
    .add("dark");

}


/* =================================
   BACK
================================= */

function goBack(){

  location.href =
    "../";

}


/* =================================
   START
================================= */

load();

</script>

</body>
  </html>
