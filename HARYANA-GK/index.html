<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HARYANA GK</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 padding:15px;
 font-family:Arial,sans-serif;
 background:#f3f6fb;
 color:#172033
}
.wrap{max-width:900px;margin:auto}
.top{
 background:linear-gradient(135deg,#0f9d58,#087f46);
 color:white;
 border-radius:20px;
 padding:18px;
 box-shadow:0 8px 22px #0002
}
.row{
 display:flex;
 justify-content:space-between;
 gap:10px
}
button{
 border:0;
 border-radius:10px;
 padding:9px 13px;
 background:#ffffff2b;
 color:white;
 font-size:16px
}
h1{margin:18px 0 5px;font-size:29px}
.sub{margin:0}
.search{
 width:100%;
 margin-top:16px;
 padding:13px;
 border:0;
 border-radius:12px;
 font-size:16px;
 outline:0
}
h2{font-size:21px;margin:24px 2px 12px}
#status{color:#687386;margin-bottom:14px}
.grid{display:grid;gap:12px}
.card{
 background:white;
 border-radius:18px;
 padding:17px;
 box-shadow:0 4px 14px #14233c14;
 cursor:pointer;
 text-decoration:none;
 color:inherit;
 display:block
}
.title{font-size:19px;font-weight:bold}
.file{font-size:14px;color:#788393;margin-top:6px}
.folder .title{color:#087f46}
.empty{
 background:white;
 padding:20px;
 border-radius:18px;
 color:#687386
}
.viewer{
 display:none;
 position:fixed;
 inset:0;
 background:white;
 z-index:9999
}
.viewerbar{
 height:54px;
 background:#087f46;
 color:white;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding:8px 12px
}
.viewerbar span{
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
 font-weight:bold
}
iframe{
 width:100%;
 height:calc(100vh - 54px);
 border:0
}
@media(max-width:600px){
 body{padding:10px}
 h1{font-size:27px}
 .title{font-size:18px}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">

<div class="row">
<button onclick="goBack()">← Back</button>
<button onclick="fullScreen()">⛶ Full Screen</button>
</div>

<h1 id="heading">📚 HARYANA GK</h1>

<p class="sub" id="sub">
सभी Haryana GK Tests और Folders
</p>

<input
 id="search"
 class="search"
 type="search"
 placeholder="🔎 Test या Folder खोजें..."
 oninput="searchItems()">

</div>

<h2>📁 Available</h2>

<div id="status">Loading...</div>

<div id="items" class="grid"></div>

</div>


<div id="viewer" class="viewer">

<div class="viewerbar">

<button onclick="closeTest()">← Tests</button>

<span id="viewerTitle">Test</span>

<button onclick="fullScreen()">⛶</button>

</div>

<iframe id="frame" allowfullscreen></iframe>

</div>


<script>

const OWNER="Golu171";
const REPO="study-notes";
const ROOT="HARYANA-GK";
const BRANCH="main";

let currentPath=ROOT;
let folders=[];
let files=[];


function api(path){

return "https://api.github.com/repos/"
+OWNER+"/"+REPO+"/contents/"
+path.split("/").map(encodeURIComponent).join("/")
+"?ref="+BRANCH;

}


function clean(name){

return name
.replace(/\.html$/i,"")
.replace(/[_-]+/g," ")
.replace(/\s+/g," ")
.trim();

}


function escapeHTML(text){

const d=document.createElement("div");
d.textContent=text;
return d.innerHTML;

}


function sortName(a,b){

return a.name.localeCompare(
 b.name,
 undefined,
 {numeric:true,sensitivity:"base"}
);

}


async function load(){

try{

const response=await fetch(api(currentPath),{
 headers:{
  "Accept":"application/vnd.github+json"
 }
});

if(!response.ok)
 throw new Error("GitHub API Error");

const data=await response.json();

folders=data
.filter(x=>x.type==="dir")
.sort(sortName);

files=data
.filter(x=>
 x.type==="file" &&
 /\.html$/i.test(x.name) &&
 x.name.toLowerCase()!=="index.html"
)
.sort(sortName);


let name=currentPath.split("/").pop();

document.getElementById("heading")
.textContent="📚 "+clean(name).toUpperCase();


document.getElementById("status").textContent=
folders.length+" Folder"+(folders.length==1?"":"s")
+" + "+
files.length+" HTML Test"+(files.length==1?"":"s")
+" मिले";


render();

}
catch(error){

document.getElementById("status")
.textContent="Files load नहीं हो पाईं";

document.getElementById("items").innerHTML=
'<div class="empty">Internet check करके page को फिर खोलें।</div>';

}

}


function render(){

const box=document.getElementById("items");

box.innerHTML="";


folders.forEach(folder=>{

const a=document.createElement("a");

a.className="card folder";

a.href=
location.pathname+
"?folder="+encodeURIComponent(folder.path);

a.innerHTML=
'<div class="title">📁 '
+escapeHTML(clean(folder.name))
+'</div>'
+
'<div class="file">Folder खोलें →</div>';

box.appendChild(a);

});


files.forEach(file=>{

const div=document.createElement("div");

div.className="card";

div.onclick=()=>openTest(file);

div.innerHTML=
'<div class="title">📝 '
+escapeHTML(clean(file.name))
+'</div>'
+
'<div class="file">'
+escapeHTML(file.name)
+'</div>';

box.appendChild(div);

});


if(!folders.length && !files.length){

box.innerHTML=
'<div class="empty">अभी कोई Test या Folder नहीं मिला।</div>';

}

}


function searchItems(){

const q=
document.getElementById("search")
.value.toLowerCase()
.trim();


const oldFolders=folders;
const oldFiles=files;


folders=oldFolders.filter(x=>
 x.name.toLowerCase().includes(q)
);

files=oldFiles.filter(x=>
 x.name.toLowerCase().includes(q)
);


render();


folders=oldFolders;
files=oldFiles;

}


function openTest(file){

document.getElementById("frame").src=
"./"+encodeURIComponent(file.name);

document.getElementById("viewerTitle")
.textContent=clean(file.name);

document.getElementById("viewer")
.style.display="block";

}


function closeTest(){

document.getElementById("viewer")
.style.display="none";

document.getElementById("frame").src="";

}


function fullScreen(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen()
.catch(()=>{});

}else{

document.exitFullscreen()
.catch(()=>{});

}

}


function goBack(){

if(currentPath===ROOT){

location.href="../index.html";

return;

}

const parts=currentPath.split("/");

parts.pop();

location.href=
location.pathname+
"?folder="+
encodeURIComponent(parts.join("/"));

}


const params=
new URLSearchParams(location.search);

const requested=
params.get("folder");


if(
 requested &&
 requested.startsWith(ROOT+"/")
){

currentPath=requested;

}


load();

</script>

</body>
  </html>
