<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARYANA GK - Tests</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:18px 14px 35px;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fb;
  color:#172033;
}
.container{max-width:850px;margin:auto}
.top{
  background:linear-gradient(135deg,#0f9d58,#087f46);
  color:white;
  border-radius:20px;
  padding:20px 18px;
  box-shadow:0 8px 22px rgba(0,0,0,.14);
}
.back{
  display:inline-block;
  color:white;
  text-decoration:none;
  background:rgba(255,255,255,.18);
  padding:8px 12px;
  border-radius:10px;
  margin-bottom:12px;
}
h1{margin:2px 0 5px;font-size:28px}
.sub{margin:0;opacity:.94;font-size:15px}
.search{
  width:100%;
  margin-top:16px;
  padding:13px 14px;
  border:0;
  outline:0;
  border-radius:12px;
  font-size:16px;
}
h2{margin:24px 2px 12px;font-size:21px}
#status{
  background:white;
  padding:13px;
  border-radius:12px;
  color:#5d6678;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.grid{display:grid;gap:12px}
.card{
  display:block;
  text-decoration:none;
  color:#172033;
  background:white;
  border-radius:15px;
  padding:15px 16px;
  border:1px solid #e4e8ef;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
}
.card:hover{transform:translateY(-1px)}
.title{font-size:17px;font-weight:700}
.file{font-size:12px;color:#778095;margin-top:6px;word-break:break-all}
.empty{padding:18px;background:white;border-radius:14px;color:#667085}
.dark{background:#111827;color:#e8edf7}
.dark .card,.dark #status{background:#1b2433;color:#e8edf7;border-color:#303b4d}
.dark .file{color:#aab4c5}
.dark .search{background:#1b2433;color:white}
.dark .empty{background:#1b2433;color:#c8d0dd}
.mode{
  float:right;
  border:0;
  background:rgba(255,255,255,.18);
  color:white;
  border-radius:10px;
  padding:8px 10px;
  font-size:15px;
}
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <button class="mode" onclick="toggleDark()">🌙</button>
    <a class="back" href="../index.html">← Home</a>
    <h1>📚 HARYANA GK</h1>
    <p class="sub">सभी Haryana GK HTML Tests यहाँ मिलेंगे</p>
    <input id="search" class="search" type="search" placeholder="🔎 Test खोजें..." oninput="filterTests()">
  </div>

  <h2>📁 Available Tests</h2>
  <div id="status">Tests की सूची लोड हो रही है...</div>
  <div id="tests" class="grid"></div>
</div>

<script>
const OWNER = "Golu171";
const REPO = "study-notes";
const FOLDER = "HARYANA-GK";
const BRANCH = "main";

let allTests = [];

async function loadTests(){
  const status = document.getElementById("status");
  const box = document.getElementById("tests");

  try{
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}?ref=${BRANCH}`;
    const response = await fetch(url, {
      headers: { "Accept": "application/vnd.github+json" }
    });

    if(!response.ok) throw new Error("GitHub API error");

    const files = await response.json();

    allTests = files
      .filter(x => x.type === "file" &&
                   x.name.toLowerCase().endsWith(".html") &&
                   x.name.toLowerCase() !== "index.html")
      .sort((a,b) => a.name.localeCompare(b.name, undefined, {
        numeric:true, sensitivity:"base"
      }));

    status.textContent = `${allTests.length} HTML Test${allTests.length===1?"":"s"} मिले`;
    renderTests(allTests);

  }catch(error){
    status.textContent = "Tests की सूची लोड नहीं हो पाई। थोड़ी देर बाद फिर खोलें।";
    box.innerHTML = "";
  }
}

function renderTests(files){
  const box = document.getElementById("tests");
  box.innerHTML = "";

  if(!files.length){
    box.innerHTML = '<div class="empty">अभी कोई HTML Test नहीं मिला।</div>';
    return;
  }

  files.forEach(file => {
    const a = document.createElement("a");
    a.className = "card";
    a.href = encodeURI("./" + file.name);
    a.innerHTML = `
      <div class="title">📝 ${escapeHtml(cleanName(file.name))}</div>
      <div class="file">${escapeHtml(file.name)}</div>
    `;
    box.appendChild(a);
  });
}

function cleanName(name){
  return name.replace(/\.html$/i,"")
             .replace(/[_-]+/g," ")
             .replace(/\s+/g," ")
             .trim();
}

function escapeHtml(text){
  const d=document.createElement("div");
  d.textContent=text;
  return d.innerHTML;
}

function filterTests(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  renderTests(allTests.filter(x =>
    x.name.toLowerCase().includes(q)
  ));
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("haryanaDark",
    document.body.classList.contains("dark") ? "1" : "0");
}

if(localStorage.getItem("haryanaDark")==="1")
  document.body.classList.add("dark");

loadTests();
</script>
</body>
</html>
