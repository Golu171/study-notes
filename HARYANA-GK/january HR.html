<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-white transition-colors duration-200 min-h-screen flex flex-col font-sans">

  <main class="max-w-3xl mx-auto px-4 py-8 flex-1 w-full flex flex-col justify-center">

    </div>
  </main>

  <script>
    const Q = (id, s, o, c, e) => ({ id, sentence: s, options: o, correct: c, exp: e });

    const questionsData = [
      Q(1, "39वें सूरजकुंड अंतर्राष्ट्रीय हस्तशिल्प मेले का उद्घाटन किसने किया?", ["(A) द्रौपदी मुर्मू", "(B) सीपी राधाकृष्णन", "(C) नरेंद्र मोदी", "(D) अमित शाह"], 1, "• फरीदाबाद जिले के सूरजकुंड में 31 जनवरी 2026 को उपराष्ट्रपति सीपी राधाकृष्णन ने 39वें सूरजकुंड अंतर्राष्ट्रीय हस्तशिल्प मेले का उद्घाटन किया<br>• इस महोत्सव की टैगलाइन 'लोकल से ग्लोबल-आत्मनिर्भर भारत की पहचान' रखी गई है<br>• इस मेले में पहली बार मेघालय को और उत्तर प्रदेश को दूसरी बार थीम स्टेट चुना गया है<br>• वहीं, मिस्र को पार्टनर कंट्री घोषित किया गया है<br>• पूर्वोत्तर के आठ राज्य सांस्कृतिक पार्टनर चुने गए हैं"),
      Q(2, "हरियाणा के किस जिले के उमरी गांव में गुरु रविदास की 649वीं जयंती पर राज्यस्तरीय समारोह का आयोजन किया गया?", ["(A) यमुनानगर", "(B) चरखी दादरी", "(C) महेंद्रगढ़", "(D) कुरुक्षेत्र"], 3, "• संत शिरोमणि गुरु रविदास की 649वीं जयंती पर 31 जनवरी 2026 को कुरुक्षेत्र के उमरी गांव में राज्यस्तरीय समारोह का आयोजन किया गया, जिसमें केंद्रीय मंत्री मनोहर लाल और सीएम नायब सिंह सैनी ने मुख्य अतिथि के रूप में भाग लिया<br>• कुरुक्षेत्र के उमरी में 124 करोड़ रुपए खर्च कर गुरु रविदास स्मारक बनाया जा रहा है, जहां पर संत रविदास की 38 मीटर ऊंची प्रतिमा बनेगी"),
      Q(3, "हरियाणा के सहयोग से पहला आर्टिफिशियल इंटेलिजेंस (एआई) शिखर सम्मेलन कहां आयोजित किया गया?", ["(A) नोएडा", "(B) अलवर", "(C) चंडीगढ़", "(D) नई दिल्ली"], 2, "• हरियाणा को आर्टिफिशियल इंटेलिजेंस का हब बनाने और सूचना प्रौद्योगिकी में नए अवसर पैदा करने के उद्देश्य से राज्य सरकार के सहयोग से दी इंडस एंटरप्रेन्योर्स चंडीगढ़ द्वारा 31 जनवरी 2026 को चंडीगढ़ में पहला एआई शिखर सम्मेलन आयोजित किया गया<br>• इस शिखर सम्मेलन की थीम 'लोकल एआई-रियल इम्पैक्ट' रखी गई"),
      Q(4, "हरियाणा के सुपवा के छात्रों की किस फिल्म का चयन 43वें बुसान इंटरनेशनल फेस्टिवल के लिए हुआ है?", ["(A) द एंडलेस जर्नी", "(B) लाइफ ऑन द एज", "(C) हरियाणा स्टोरी", "(D) विजुअल ड्रीम्स"], 1, "• रोहतक स्थित दादा लख्मी चंद स्टेट यूनिवर्सिटी ऑफ परफॉर्मिंग एंड विजुअल आर्ट्स की ओर से निर्मित फिल्म 'लाइफ ऑन द एज' का चयन 43वें बुसान इंटरनेशनल शॉर्ट फिल्म फेस्टिवल के लिए हुआ है<br>• इस फिल्म में लॉकडाउन के दौरान एक परिवार के सामाजिक और आर्थिक संघर्ष को दिखाया गया है"),
      Q(5, "सुप्रीम कोर्ट ने सभी राज्यों और केन्द्र शासित प्रदेशों को सभी स्कूलों में किन कक्षाओं की लड़कियों के लिए निशुल्क बायोडिग्रेडेबल सैनिटरी नैपकिन उपलब्ध कराने का निर्देश दिया?", ["(A) कक्षा 4 से 8 तक", "(B) कक्षा 5 से 10 तक", "(C) कक्षा 6 से 12 तक", "(D) इनमें से कोई नहीं"], 2, "• सुप्रीम कोर्ट ने कहा है कि मासिक धर्म स्वास्थ्य का अधिकार संविधान के अनुच्छेद 21 के तहत 'जीवन और गरिमा के अधिकार में निहित मौलिक अधिकार' का हिस्सा है<br>• कक्षा 6 से 12 तक लड़कियों के लिए निशुल्क बायोडिग्रेडेबल सैनिटरी नैपकिन निशुल्क उपलब्ध कराने का निर्देश दिया"),
      Q(6, "हरियाणा सरकार के नए नियमों के अनुसार ग्राम पंचायत की किसी भी बैठक में कोई प्रस्ताव पास करने के लिए कुल कितने प्रतिशत सदस्यों की उपस्थिति अनिवार्य है?", ["(A) 40%", "(B) 45%", "(C) 50%", "(D) 55%"], 0, "• नए नियमों (2025-26) के अनुसार, ग्राम पंचायत की किसी भी योजना या विकासात्मक कार्य के लिए ग्राम सभा की बैठक में कुल सदस्यों (मतदाताओं) की 40% उपस्थिति अनिवार्य कर दी गई है<br>• पहली बैठक: 40%<br>• दूसरी बैठक: 30%<br>• तीसरी बैठक: 20%"),
      Q(7, "किस कंपनी ने हरियाणा में छात्रों और शिक्षकों के लिए एआई क्लासरूम प्रोग्राम शुरू किया है?", ["(A) टाटा कम्युनिकेशन्स", "(B) एयरटेल", "(C) वोडाफोन आइडिया", "(D) रिलायंस जियो"], 3, "• रिलायंस जियो ने हरियाणा में स्कूली छात्रों और शिक्षकों को एआई-रेडी बनाने के उद्देश्य से एआई क्लासरूम प्रोग्राम शुरू किया है<br>• यह पहल जियो की 'सभी के लिए एआई' मुहिम का हिस्सा है"),
      Q(8, "हरियाणा के किस जिले में स्थित गन्ना प्रजनन संस्थान ने गन्ने की नई किस्म सीओ-18022 (कर्ण-18) विकसित की है?", ["(A) करनाल", "(B) सिरसा", "(C) हिसार", "(D) अम्बाला"], 0, "• हरियाणा के करनाल के क्षेत्रीय अनुसंधान केंद्र में स्थित गन्ना प्रजनन संस्थान (SBI-RC) ने गन्ने की एक नई और उन्नत किस्म, सीओ-18022 (कर्ण-18) विकसित की है<br>• यह मौजूदा किस्म Co-05011 की तुलना में लगभग 30% अधिक उत्पादन देती है"),
      Q(9, "किक बॉक्सिंग में वर्ल्ड में नंबर वन खिलाड़ी बनने वाली भारतीय खिलाड़ी कौन बनी है?", ["(A) रिद्धिमा कौशिक", "(B) साक्षी मलिक", "(C) हरवीन कौर", "(D) मीराबाई मलिक"], 0, "• वर्ल्ड एसोसिएशन ऑफ किक बॉक्सिंग आर्गेनाइजेशन द्वारा 27 जनवरी 2026 को जारी वर्ल्ड रैंकिंग में जींद जिले के भौंगरा गांव की रिद्धिमा कौशिक ने पहली रैंक प्राप्त की<br>• रिद्धिमा ने किक लाइट 55 किलोग्राम और 60 किलोग्राम भारवर्ग में भी पहली रैंक प्राप्त की है"),
      Q(10, "केंद्र की 14वीं वार्षिक एकीकृत रेटिंग में यूएचबीवीएन और डीएचबीवीएन हरियाणा को कौन सी ग्रेड मिली है?", ["(A) ए", "(B) ए+", "(C) बी", "(D) बी+"], 0, "• विद्युत मंत्रालय द्वारा जारी रिपोर्ट में उत्तर हरियाणा बिजली वितरण निगम (UHBVN) और दक्षिण हरियाणा बिजली वितरण निगम (DHBVN) को 'ए' ग्रेड मिली हैं<br>• राज्यों की खुद कंपनियों के मामले में DHBVN 9वें तो UHBVN 13वें नंबर पर रही"),
      Q(11, "जनगणना 2027 के अंतर्गत हरियाणा में हाउस-लिस्टिंग कार्य कब से कब तक किया जाएगा?", ["(A) 1 से 30 मार्च 2026", "(B) 1 से 30 अप्रैल 2026", "(C) 1 से 30 मई 2026", "(D) 1 से 30 जून 2026"], 2, "• हरियाणा सरकार ने राज्य में जनगणना-2027 के अंतर्गत हाउस-लिस्टिंग कार्य की समय-सारिणी अधिसूचित कर दी है<br>• यह कार्य 1 मई से 30 मई 2026 तक 30 दिनों की अवधि में संपन्न किया जाएगा"),
      Q(12, "चंडीगढ़ के नए मेयर कौन चुने गए हैं?", ["(A) अतुल अहलावत", "(B) सौरभ जोशी", "(C) मनिन्द्र सिंह", "(D) प्रभजोत सिंह"], 1, "• भाजपा पार्षद सौरभ जोशी को चंडीगढ़ नगर निगम का नया मेयर चुना गया है<br>• भाजपा ने सीनियर डिप्टी मेयर और डिप्टी मेयर के पद भी जीते हैं"),
      Q(13, "यमुना में पर्यावरणीय प्रवाह बढ़ाने के लिए हरियाणा की किस नहर से पानी छोड़ा जाएगा?", ["(A) गुड़गांव नहर", "(B) सफीदों नहर", "(C) जगाधरी नहर", "(D) मुनक नहर"], 3, "• केंद्र सरकार ने यमुना नदी के पुनर्जीवन के लिए गंग और मुनक नहर से पानी मोड़ने की योजना बनाई है<br>• इसके तहत यमुना में पर्यावरणीय प्रवाह बढ़ाया जाएगा, ताकि नदी में पानी की कमी और प्रदूषण की समस्या कम हो सके"),
      Q(14, "वाइली रिसर्च हीरोज पुरस्कार से किसे सम्मानित किया गया है?", ["(A) डॉ. चंद्रकांत लहरिया", "(B) डॉ. जितेन्द्र अहलावत", "(C) डॉ. अभिजात शेठ", "(D) डॉ. आकाश जोशी"], 0, "• इंडियन पब्लिक हेल्थ विशेषज्ञ डॉ. चंद्रकांत लहरिया को वाइली रिसर्च हीरोज पुरस्कार से सम्मानित किया गया<br>• वे यह पुरस्कार पाने वाले पहले भारतीय हैं<br>• उन्हें यह सम्मान 'इम्पैक्ट बियॉन्ड एकेडेमिया' श्रेणी में दिया गया है"),
      Q(15, "हरियाणा के किस जिले में देश का पहला कुत्तों का श्मशान घाट तैयार किया गया है?", ["(A) फरीदाबाद", "(B) सोनीपत", "(C) यमुनानगर", "(D) कैथल"], 0, "• फरीदाबाद स्मार्ट सिटी के बुढ़ैना गांव में देश का पहला कुत्तों का श्मशान घाट तैयार किया गया है<br>• यहां उपलों से कुत्तों का अंतिम संस्कार होगा"),
      Q(16, "हरियाणा के किस जिले के प्रगतिशील किसान यशपाल खोला को राष्ट्रपति द्रौपदी मुर्मू ने गणतंत्र दिवस पर विशेष अतिथि के रूप में आमंत्रित किया?", ["(A) सिरसा", "(B) करनाल", "(C) रेवाड़ी", "(D) झज्जर"], 2, "• रेवाड़ी जिले के गांव कंवाली के प्रगतिशील किसान यशपाल खोला को देश के 77वें गणतंत्र दिवस पर राष्ट्रपति द्रौपदी मुर्मू ने विशेष अतिथि के रूप में आमंत्रित किया<br>• यशपाल देश के उन 6 चुनिंदा किसानों में शामिल हैं, जो 25 से 28 जनवरी 2026 तक राष्ट्रपति भवन के राजकीय मेहमान रहे"),
      Q(17, "वर्ष 2026 में लाला लाजपत राय की कौन सी जयंती मनाई गई?", ["(A) 151वीं", "(B) 161वीं", "(C) 171वीं", "(D) 181वीं"], 1, "• स्वतंत्रता सेनानी एवं 'पंजाब केसरी' लाला लाजपत राय की 161वीं जयंती मनाई गई<br>• लाला लाजपत राय का जन्म 28 जनवरी 1865 को वर्तमान पंजाब के धुडिके गाँव में हुआ था"),
      Q(18, "स्वास्थ्य परिषदों को एक पोर्टल पर लाने वाला देश का पहला राज्य कौन सा बन गया है?", ["(A) राजस्थान", "(B) उत्तर प्रदेश", "(C) बिहार", "(D) हरियाणा"], 3, "• हरियाणा के मुख्यमंत्री नायब सिंह सैनी ने 28 जनवरी 2026 को स्वास्थ्य विभाग के 'सेंट्रलाइज्ड पोर्टल फॉर हरियाणा काउंसिल्स' का लोकार्पण किया<br>• इस पहल के साथ ही हरियाणा देश का पहला राज्य बन गया है जिसने एक इंटीग्रेटेड डिजिटल प्लेटफॉर्म लॉन्च कर एक साथ कई स्वास्थ्य परिषदों को एक ही सिस्टम पर लाने का कार्य किया है"),
      Q(19, "हरियाणा के किस गांव की किसान सावित्री जांदू को 26 जनवरी को गणतंत्र दिवस पर राष्ट्रपति द्रौपदी मुर्मू द्वारा विशेष रूप से सम्मानित किया गया?", ["(A) मिरान", "(B) मतलौडा", "(C) मोड़ाखेड़ा", "(D) सीसवाल"], 2, "• हिसार जिले के गांव मोड़ाखेड़ा की 56 वर्षीय महिला किसान सावित्री जांदू ने प्रधानमंत्री किसान ऊर्जा सुरक्षा एवं उत्थान महाभियान (पीएम-कुसुम योजना) के तहत अपनी 8 एकड़ कृषि भूमि पर दो मेगावाट क्षमता का सोलर पावर प्लांट लगाकर एक नई मिसाल कायम की है"),
      Q(20, "चंडीगढ़ की आधिकारिक राजकीय तितली किसे घोषित किया गया है?", ["(A) कॉमन मॉर्मन तितली", "(B) धारीदार बाघ तितली", "(C) ब्लू मॉर्मन तितली", "(D) पीकॉक तितली"], 1, "• चंडीगढ़ के राज्य वन्यजीव बोर्ड ने धारीदार बाघ तितली (Striped Tiger Butterfly) को केंद्रशासित प्रदेश की आधिकारिक राजकीय तितली घोषित किया है<br>• इसका वैज्ञानिक नाम Danaus genutia है"),
      Q(21, "हरियाणा का पहला वर्ल्ड स्किल रिसोर्स लैब सेंटर किस जिले में बनाया जाएगा?", ["(A) रोहतक", "(B) भिवानी", "(C) नूंह", "(D) चरखी दादरी"], 0, "• केंद्रीय कौशल विकास एवं उद्यमिता राज्यमंत्री जयंत चौधरी ने घोषणा की है कि रोहतक में हरियाणा का पहला विश्व स्किल रिसोर्स लैब सेंटर बनाया जाएगा"),
      Q(22, "गणतंत्र दिवस 2026 के अवसर पर हरियाणा के कितने पुलिस अफसरों को पुलिस पदक से सम्मानित किया गया?", ["(A) 8", "(B) 12", "(C) 15", "(D) 19"], 1, "• 26 जनवरी 2026 को 77वें गणतंत्र दिवस पर फरीदाबाद के संयुक्त पुलिस आयुक्त (डीआईजी) राजेश दुग्गल, झज्जर जिला जेल के अधीक्षक सेवा सिंह को राष्ट्रपति पुलिस पदक से सम्मानित किया गया<br>• इसके अलावा 12 पुलिस अफसरों को पुलिस पदक से सम्मानित किया गया"),
      Q(23, "वर्ष 2026 के लिए हरियाणा के कितने लोगों को पद्म पुरस्कारों के लिए चुना गया है?", ["(A) 2", "(B) 4", "(C) 6", "(D) 8"], 0, "• सिरसा की हॉकी प्लेयर सविता पूनिया को खेल के लिए और पानीपत में रहने वाले बुनकर खेमराज सुंदरियाल को कला के क्षेत्र के लिए वर्ष 2026 के पद्म श्री के लिए चुना गया है"),
      Q(24, "किस हरियाणवी को कला के क्षेत्र में पद्म श्री 2026 के लिए चुना गया है?", ["(A) पंडित लखमी चंद", "(B) मनोज तिवारी", "(C) खेमराज सुंदरियाल", "(D) सुरेश तिवारी"], 2, "• पानीपत के हथकरघा के क्षेत्र में अपना जीवन समर्पित करने वाले 81 वर्षीय खेमराज सुंदरियाल को पद्म श्री 2026 से सम्मानित किया जाएगा<br>• उनकी सबसे बड़ी उपलब्धि पुंजा दरी लूम में पुंजा को 'हत्था तकनीक' से बदलना रहा"),
      Q(25, "हरियाणा की सविता पूनिया को किस क्षेत्र के लिए पद्म श्री 2026 के लिए चुना गया है?", ["(A) खेल", "(B) कला", "(C) विज्ञान", "(D) शिक्षा"], 0, "• भारतीय महिला हॉकी टीम की अनुभवी गोलकीपर और 'आयरन वॉल' के नाम से मशहूर सिरसा की सविता पूनिया को पद्म श्री 2026 पुरस्कार से सम्मानित किया जाएगा"),
      Q(26, "हरियाणा के किस जिले के शाहाबाद से सम्बंधित बलदेव सिंह को पद्म श्री 2026 के लिए चुना गया है?", ["(A) अम्बाला", "(B) कुरुक्षेत्र", "(C) करनाल", "(D) सिरसा"], 1, "• शाहाबाद की मिट्टी में तप हरियाणा की महिला हॉकी में बदलाव लाने वाले द्रोणाचार्य अवार्डी से सम्मानित बलदेव सिंह को पद्म श्री 2026 पुरस्कार से सम्मानित किया जाएगा<br>• अभी बलदेव सिंह लुधियाना में रह रहे हैं और उन्हें पंजाब राज्य की तरफ से पद्म श्री के लिए चुना गया है"),
      Q(27, "हरियाणा में सभी गांव किस पोर्टल से जोड़े गए हैं?", ["(A) मेरा गांव-मेरी धरोहर पोर्टल", "(B) डिजिटल इंडिया ग्राम पोर्टल", "(C) हरियाणा ग्राम सेवा पोर्टल", "(D) हरि ग्राम दर्शन पोर्टल"], 0, "• चाहे गांव की सांस्कृति विरासत, पारंपरिक खाना हो या फिर विरासत स्थल अब गांव की हर जानकारी एक क्लिक पर मिलेगी<br>• हरियाणा ही नहीं, देश के हर गांव को 'मेरा गांव मेरी धरोहर' पोर्टल से जोड़ दिया गया है"),
      Q(28, "गणतंत्र दिवस 2026 के अवसर पर हरियाणा के किस जिले की अक्षिता धनखड़ ने राष्ट्रपति द्रौपदी मुर्मू के साथ तिरंगा फहराया?", ["(A) जींद", "(B) झज्जर", "(C) यमुनानगर", "(D) फतेहाबाद"], 1, "• प्रदेश के झज्जर जिले के कासनी गांव की बेटी फ्लाइट लेफ्टिनेंट अक्षिता धनखड़ ने 26 जनवरी 2026 को 77वें गणतंत्र दिवस के अवसर पर माननीया राष्ट्रपति द्रौपदी मुर्मू के साथ राष्ट्रीय ध्वज फहराया"),
      Q(29, "77वें गणतंत्र दिवस के उपलक्ष्य पर हरियाणा के मुख्यमंत्री ने किस जिले में ध्वजारोहण किया?", ["(A) हिसार", "(B) हांसी", "(C) गुरुग्राम", "(D) रोहतक"], 2, "• 26 जनवरी 2026 को 77वें गणतंत्र दिवस के उपलक्ष्य पर हरियाणा के मुख्यमंत्री नायब सिंह सैनी ने गुरुग्राम में ध्वजारोहण किया"),
      Q(30, "77वें गणतंत्र दिवस के उपलक्ष्य पर हरियाणा के राज्यपाल ने किस जिले में ध्वजारोहण किया?", ["(A) पंचकूला", "(B) अम्बाला", "(C) सिरसा", "(D) रेवाड़ी"], 0, "• 26 जनवरी 2026 को 77वें गणतंत्र दिवस के उपलक्ष्य पर हरियाणा के राज्यपाल प्रो. असीम कुमार घोष ने पंचकूला में ध्वजारोहण किया"),
      Q(31, "हरियाणा में वर्ष 2026 में राष्ट्रीय मतदाता दिवस कब मनाया गया?", ["(A) 3 जनवरी", "(B) 12 जनवरी", "(C) 25 जनवरी", "(D) 31 जनवरी"], 2, "• भारत में राष्ट्रीय मतदाता दिवस हर साल 25 जनवरी को मनाया जाता है<br>• इस वर्ष इस आयोजन का विषय 'मेरा भारत, मेरा वोट' है और इसका नारा 'भारतीय लोकतंत्र के केंद्र में नागरिक' रखा गया है"),
      Q(32, "किस हरियाणवी ने गणतंत्र दिवस परेड में दूसरी बार तटरक्षक दल की कमान संभाली?", ["(A) हार्दिक यादव", "(B) दीपेन्द्र सिंह", "(C) दीपक भारद्वाज", "(D) पुष्पेन्द्र आजाद"], 0, "• 26 जनवरी 2026 को गणतंत्र दिवस परेड में भारतीय तटरक्षक बल की कमान हरियाणा के नारनौल के बसीरपुर गांव की बहू असिस्टेंट कमांडेंट हार्दिक यादव ने संभाली"),
      Q(33, "हरियाणा के किस जिले की तीन सगी बहनों ने नेशनल ताइक्वांडो प्रतियोगिता 2026 में रजत पदक जीता?", ["(A) गुरुग्राम", "(B) फरीदाबाद", "(C) पंचकूला", "(D) कैथल"], 0, "• गुरुग्राम जिला के गांव वजीराबाद की रहने वाली तीन सगी बहनों (प्रिया यादव, गीता यादव व ऋतु यादव) ने नेशनल ताइक्वांडो प्रतियोगिता में एक बार फिर पदक जीतकर प्रदेश का नाम रोशन किया है"),
      Q(34, "हरियाणा पुलिस की किस महिला अधिकारी को केंद्रीय गृह मंत्री दक्षता पदक 2025 से सम्मानित किया गया?", ["(A) प्रोमिला रानी", "(B) अंकिता चौधरी", "(C) मोनिका रानी", "(D) मेनका सिंह"], 3, "• यमुनानगर जिले में हरियाणा पुलिस की उप निरीक्षक मेनका सिंह को केंद्रीय गृह मंत्री दक्षता पदक 2025 प्रदान किया गया है<br>• यह सम्मान उत्कृष्ट वैज्ञानिक एवं प्रभावी अनुसंधान तथा न्यायालय में सशक्त पैरवी के लिए दिया गया है"),
      Q(35, "हरियाणा के किस जिले के सीआरपीएफ अधिकारी दिनेश खटक को प्रतिष्ठित केंद्रीय गृह मंत्री दक्षता पदक 2025 से सम्मानित किया गया है?", ["(A) जींद", "(B) सिरसा", "(C) कैथल", "(D) महेंद्रगढ़"], 0, "• हरियाणा के जींद जिले के वरिष्ठ केंद्रीय रिजर्व पुलिस बल (CRPF) अधिकारी दिनेश खटक को राष्ट्रीय सुरक्षा में उनकी उल्लेखनीय सेवाओं के लिए प्रतिष्ठित केंद्रीय गृह मंत्री के दक्षता पदक से सम्मानित किया गया है"),
      Q(36, "हरियाणा में जल संरक्षण के लिए विश्व बैंक ने कितने रुपए मंजूर किए हैं?", ["(A) 5200 करोड़", "(B) 5700 करोड़", "(C) 6500 करोड़", "(D) 7000 करोड़"], 1, "• विश्व बैंक ने 'जल संरक्षित हरियाणा' परियोजना के तहत 5,700 करोड़ रुपए के ऋण को मंजूरी दी है<br>• वर्ष 2026 से 2032 तक चरणबद्ध रूप से यह राशि खर्च की जाएगी"),
      Q(37, "हरियाणा के मुख्यमंत्री नायब सिंह सैनी ने जनवरी 2026 में अपना कौन सा जन्म दिवस मनाया?", ["(A) 50वां", "(B) 53वां", "(C) 56वां", "(D) 59वां"], 2, "• 25 जनवरी 2026 को हरियाणा के सीएम नायब सिंह सैनी 56 साल के हो गए हैं<br>• नायब सिंह सैनी का जन्म 25 जनवरी 1970 को हरियाणा के अंबाला के मिर्जापुर माजरा नामक एक छोटे से गाँव में हुआ था"),
      Q(38, "भारत निर्वाचन आयोग ने कब से कब तक आईआईसीडीईएम 2026 की मेजबानी की?", ["(A) 1 से 3 जनवरी", "(B) 10 से 12 जनवरी", "(C) 21 से 23 जनवरी", "(D) 29 से 31 जनवरी"], 2, "• भारत निर्वाचन आयोग (ECI) ने नई दिल्ली के भारत मंडपम में 21 से 23 जनवरी 2026 तक आयोजित इंडिया इंटरनेशनल कॉन्फ्रेंस ऑन डेमोक्रेसी एंड इलेक्शन मैनेजमेंट (IICDEM) 2026 में चुनाव से संबंधित सभी जानकारी और सेवाओं के लिए अपना वन-स्टॉप डिजिटल प्लेटफॉर्म लॉन्च किया"),
      Q(39, "खेलो इंडिया विंटर गेम्स 2026 में स्पीड स्केटिंग की 500 मीटर पुरुष दौड़ में हरियाणा के सचिन सिंह ने कौन सा पदक जीता?", ["(A) स्वर्ण पदक", "(B) रजत पदक", "(C) कांस्य पदक", "(D) इनमें से कोई नहीं"], 0, "• हरियाणा के खिलाड़ी सचिन सिंह ने खेलो इंडिया विंटर गेम्स 2026 में स्पीड स्केटिंग की 500 मीटर पुरुष दौड़ में स्वर्ण पदक जीतकर हरियाणा का नाम रोशन किया"),
      Q(40, "हरियाणा के किस नेशनल पार्क में प्रदेश का पहला आर्टिफिशियल इंटेलिजेंस (एआई) पावर्ड वन निगरानी सिस्टम स्थापित किया जाएगा?", ["(A) सुल्तानपुर नेशनल पार्क", "(B) कलेसर नेशनल पार्क", "(C) भिंडावास नेशनल पार्क", "(D) खपरवास नेशनल पार्क"], 1, "• हरियाणा सरकार यमुनानगर जिले के कलेसर नेशनल पार्क में प्रदेश का पहला एआई पावर्ड वन निगरानी सिस्टम स्थापित करेगी<br>• इससे जंगल में आग लगने के 8 से 10 मिनट के भीतर ही सेंसर्स से अलर्ट मिल जाएगा"),
      Q(41, "हरियाणा के किस जिले में देश की सबसे बड़ी ड्राई-फ्रूट मार्केट बनाई जाएगी?", ["(A) पानीपत", "(B) करनाल", "(C) चरखी दादरी", "(D) सोनीपत"], 3, "• हरियाणा के सोनीपत में पंजाब के अमृतसर के ड्राई फ्रूट मिलेंगे<br>• यहाँ देश की सबसे बड़ी ड्राई-फ्रूट मार्केट बनाई जाएगी, जिसके लिए सरकार ने भूमि का प्रस्ताव पास कर दिया है"),
      Q(42, "अंतरराष्ट्रीय सरस्वती महोत्सव 2026 का उद्घाटन समारोह कहां आयोजित किया गया?", ["(A) आदि बद्री", "(B) हंस उद्दर तीर्थ", "(C) सरस्वती नगर", "(D) पिसोल तीर्थ"], 0, "• यमुनानगर जिले में श्री आदि बद्री स्थित सरस्वती उद्गम स्थल के निकट सरोवर पर 19 जनवरी 2026 को अंतरराष्ट्रीय सरस्वती महोत्सव की शुरुआत हुई"),
      Q(43, "टाइम्स हायर एजुकेशन वर्ल्ड यूनिवर्सिटी रैंकिंग 2026 में जीजेयू को जीव विज्ञान विषय श्रेणी में भारत में कौन सा स्थान मिला है?", ["(A) 15वां", "(B) 23वां", "(C) 29वां", "(D) 35वां"], 1, "• हिसार स्थित गुरु जम्भेश्वर विज्ञान एवं प्रौद्योगिकी विश्वविद्यालय (GJU) ने टाइम्स हायर एजुकेशन (THE) वर्ल्ड यूनिवर्सिटी रैंकिंग 2026 में भौतिक विज्ञान, जीव विज्ञान और इंजीनियरिंग तीनों विषय श्रेणियों में शानदार प्रदर्शन किया है<br>• जीजेयू को जीव विज्ञान विषय श्रेणी में भारत में 23वां और विश्व में 601-800 बैंड में स्थान मिला है"),
      Q(44, "हरियाणा विधान सभा में दो दिवसीय 'हरियाणा युवा संवाद' के दूसरे संस्करण का शुभारंभ किसने किया?", ["(A) असीम कुमार घोष", "(B) नायब सिंह सैनी", "(C) हरविन्द्र कल्याण", "(D) कंवर पाल गुर्जर"], 2, "• हरियाणा विधान सभा में 16 से 17 जनवरी 2026 तक राजधानी युवा संसद संस्था के सहयोग से दो दिवसीय हरियाणा युवा संवाद का दूसरा संस्करण आयोजित किया गया<br>• कार्यक्रम का शुभारंभ विधान सभा अध्यक्ष हरविन्द्र कल्याण ने दीप प्रज्जवलित कर किया"),
      Q(45, "प्रधानमंत्री मोदी ने हरियाणा के किस जिले से असम के कामाख्या तक अमृत भारत एक्सप्रेस का उद्घाटन किया?", ["(A) रोहतक", "(B) करनाल", "(C) सिरसा", "(D) यमुनानगर"], 0, "• प्रधानमंत्री मोदी ने असम के नागांव जिले में कलियाबोर से दो नई अमृत भारत एक्सप्रेस रेलगाड़ियों को झंडी दिखाई<br>• ये रेलगाड़ियां कामाख्या-रोहतक अमृत भारत एक्सप्रेस और डिब्रूगढ़-लखनऊ गोमती नगर अमृत भारत एक्सप्रेस हैं"),
      Q(46, "सेना में सेवा उपरांत अग्निवीरों को रोजगार का सुरक्षा कवच देने वाला हरियाणा देश का कौन सा राज्य बन गया है?", ["(A) पहला", "(B) दूसरा", "(C) तीसरा", "(D) चौथा"], 0, "• जुलाई 2026 में अग्निपथ योजना के पहले बैच की सेवा पूर्ण होने के बाद, हरियाणा सरकार अगस्त 2026 से अपनी नई 'अग्निवीर नीति' लागू करेगी<br>• इस नीति के माध्यम से अग्निवीरों को सरकारी नौकरियों एवं अन्य क्षेत्रों में रोजगार के अवसर प्रदान किए जाएंगे"),
      Q(47, "सांसद नवीन जिंदल की पहल के तहत किस राज्य में स्थित कांगला फोर्ट में देश का 200वां विशाल तिरंगा फहराया गया?", ["(A) असम", "(B) हरियाणा", "(C) बिहार", "(D) मणिपुर"], 3, "• देश में हर नागरिक को सम्मान के साथ तिरंगा फहराने का अधिकार दिलाने वाले हिसार के सांसद और फ्लैग फाउंडेशन ऑफ इंडिया के अध्यक्ष नवीन जिंदल की पहल फिर चर्चा में है<br>• उनके नेतृत्व में मणिपुर की राजधानी इम्फाल स्थित ऐतिहासिक कांगला फोर्ट में देश का 200वां विशाल तिरंगा फहराया गया"),
      Q(48, "कौन हरियाणवी पर्वतारोही यूरोप की सबसे ऊंची चोटी माउंट एलब्रुस पर 24 घंटे तक रुकने वाले दुनिया के पहले पर्वतारोही बन गए हैं?", ["(A) नरेंद्र कुमार", "(B) संदीप धायल", "(C) रोहतास बिश्नोई", "(D) अतुल जागलान"], 2, "• हरियाणा के हिसार जिले के मलापूर गांव के 27 वर्षीय पर्वतारोही रोहतास बिश्नोई यूरोप की सबसे ऊंची चोटी माउंट एलब्रुस पर 24 घंटे तक रुकने वाले दुनिया के पहले पर्वतारोही बन गए हैं"),
      Q(49, "हरियाणा के किस शहर में 10 एकड़ में ग्लोबल टेक्सटाइल एक्सपोर्ट हब बनेगा?", ["(A) सोनीपत", "(B) पानीपत", "(C) करनाल", "(D) यमुनानगर"], 1, "• टेक्सटाइल सेक्टर को अंतरराष्ट्रीय मानकों तक ले जाने के लिए पानीपत में 10 एकड़ भूमि पर एक अंतरराष्ट्रीय स्तर का टेक्सटाइल संस्थान स्थापित किया जाएगा, जहां आधुनिक तकनीक, डिजाइन और व्यापारिक दक्षता का संगम होगा"),
      Q(50, "किस हरियाणवी मुक्केबाज को एशियाई मुक्केबाजी परिषद में सदस्य के रूप में नियुक्त किया गया?", ["(A) देवेन्द्र बिसो", "(B) विकास राणा", "(C) अजय कुमार", "(D) विजेंदर सिंह"], 3, "• 18 जनवरी 2026 को हरियाणवी बॉक्सर विजेंदर सिंह एशियन बॉक्सिंग काउंसिल के मेंबर अपॉइंट किए गए हैं<br>• विजेंदर सिंह 2008 बीजिंग ओलंपिक में कांस्य पदक जीतने वाले पहले बॉक्सर थे"),
      Q(51, "78वें सेना दिवस पर हरियाणा के किस जवान को सेना मेडल से सम्मानित किया गया?", ["(A) लांस नायक दिग्विजय भाम्भू", "(B) लांस नायक अमरिंदर सिंह", "(C) लांस नायक कालूराम", "(D) लांस नायक प्रदीप नैन"], 3, "• 15 जनवरी 2026 को 78वें सेना दिवस पर आयोजित 'वीरोत्सव' कार्यक्रम में देश के लिए जान देने वाले पांच जवानों के परिजनों को सेना मेडल दिया गया<br>• इनमें पुलवामा हमले में आतंकियों से मुठभेड़ में शहीद हुए जींद के जाजनवाला गांव के लांस नायक प्रदीप नैन को सेना मेडल दिया गया"),
      Q(52, "प्रति व्यक्ति दूध की उपलब्धता में हरियाणा देश में किस स्थान पर है?", ["(A) पहले", "(B) दूसरे", "(C) तीसरे", "(D) चौथे"], 2, "• केंद्रीय पशुपालन एवं डेयरी मंत्रालय की 'बेसिक एनिमल हस्बेंड्री स्टेटिक्स 2025' नाम से जारी रिपोर्ट के अनुसार, हरियाणा में बीते एक साल में प्रति व्यक्ति दूध की उपलब्धता 23 ग्राम बढ़ी है<br>• इस मामले में पंजाब 1318 ग्राम के साथ पहले और राजस्थान 1229 ग्राम के साथ तीसरे स्थान पर है"),
      Q(53, "हरियाणा के किस जिले में प्रदूषण कम करने और हरित क्षेत्र बढ़ाने के लिए ईको-वन परियोजना शुरू की गई है?", ["(A) फरीदाबाद", "(B) रेवाड़ी", "(C) पंचकूला", "(D) अम्बाला"], 0, "• हरियाणा सरकार ने वायु प्रदूषण से निपटने के लिए 'इको-वन' परियोजना शुरू की है<br>• फरीदाबाद से शुरू हुई इस पहल में अनुपयोगी भूमि को मिनी फॉरेस्ट में बदला जा रहा है"),
      Q(54, "हाल ही में किस भारतीय स्टार बैडमिंटन खिलाड़ी ने संन्यास लिया है?", ["(A) साइना नेहवाल", "(B) पी. वी. सिंधु", "(C) ज्वाला गुट्टा", "(D) अश्विनी पोनप्पा"], 0, "• हरियाणा के हिसार जिले में 17 मार्च 1990 को जन्मी भारत की स्टार बैडमिंटन खिलाड़ी 35 वर्षीय साइना नेहवाल ने जनवरी 2026 में प्रोफेशनल बैडमिंटन से संन्यास ले लिया है"),
      Q(55, "देश का पहला ऐसा विश्वविद्यालय कौन सा है जिसके पास अपने सात सामुदायिक रेडियो स्टेशन हैं?", ["(A) महर्षि दयानंद विश्वविद्यालय", "(B) चौधरी बंसीलाल विश्वविद्यालय", "(C) कुरुक्षेत्र विश्वविद्यालय", "(D) चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय"], 3, "• हिसार जिले में स्थित चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय (HAU) देश का पहला ऐसा विश्वविद्यालय है जिसके पास अपने सात सामुदायिक रेडियो स्टेशन हैं"),
      Q(56, "हरियाणा के किस जिले में स्थित वेटरनरी प्रशिक्षण संस्थान को ए प्लस ग्रेड मिला है?", ["(A) महेंद्रगढ़", "(B) यमुनानगर", "(C) हिसार", "(D) रोहतक"], 2, "• केंद्रीय पशुपालन एवं डेयरी विभाग द्वारा जारी रैंकिंग में हिसार के सिरसा रोड स्थित राज्य स्तरीय वेटरनरी प्रशिक्षक प्रशिक्षण संस्थान को ए प्लस ग्रेड मिला है"),
      Q(57, "हरियाणा में किन जिलों में स्वाइन फ्लू और बर्ड फ्लू जैसी बीमारियों के सैंपल जांच के लिए अत्याधुनिक लैब बनाई जाएगी?", ["(A) पलवल और नूंह", "(B) भिवानी और करनाल", "(C) सोनीपत और पंचकूला", "(D) जींद और फरीदाबाद"], 2, "• हरियाणा सरकार ने सोनीपत और पंचकूला में स्वाइन फ्लू और बर्ड फ्लू जैसी बीमारियों के सैंपलों की जांच के लिए अत्याधुनिक लैब स्थापित करने की योजना बनाई है"),
      Q(58, "कामेश्वर धाम हरियाणा के किस जिले में स्थित है?", ["(A) हिसार", "(B) कैथल", "(C) सोनीपत", "(D) रेवाड़ी"], 0, "• हिसार जिले के किरमारा गांव में कामेश्वर धाम स्थित है<br>• किरमारा में श्रीश्री 1008 मुनिगिरी महाराज 5 जनवरी 2026 को सांसारिक जीवन यात्रा पूरी कर गए हैं"),
      Q(59, "हरियाणा के किस जिले में आधुनिक किन्नू जूस प्रोसेसिंग प्लांट बनाया जाएगा?", ["(A) फतेहाबाद", "(B) अम्बाला", "(C) कुरुक्षेत्र", "(D) सिरसा"], 3, "• हरियाणा एग्रो इंडस्ट्रीज कॉर्पोरेशन और हरियाणा डेयरी विकास सहकारी संघ (वीटा) मिलकर सिरसा जिले में एक आधुनिक किन्नू जूस प्रोसेसिंग प्लांट की स्थापना करेंगे"),
      Q(60, "चौथा आलू एक्सपो हरियाणा के किस जिले में आयोजित किया गया?", ["(A) भिवानी", "(B) करनाल", "(C) चरखी दादरी", "(D) पलवल"], 1, "• हरियाणा के बागवानी विभाग द्वारा करनाल में दो दिवसीय 'चौथा आलू एक्सपो' सफलतापूर्वक संपन्न हुआ"),
      Q(61, "हरियाणा के किस संस्थान को खेल प्रबंधन के क्षेत्र में सर्वश्रेष्ठ सरकारी प्रबंधन संस्थान से सम्मानित किया गया है?", ["(A) कुरुक्षेत्र विश्वविद्यालय", "(B) आईआईएम रोहतक", "(C) महर्षि दयानंद विश्वविद्यालय", "(D) आईआईएम रोहतक"], 3, "• 15 जनवरी 2026 को नई दिल्ली स्थित इंडिया इंटरनेशनल सेंटर में ग्लोबल स्पोर्ट्स एजुकेशन कन्वेंशन 2026 के दौरान भारतीय प्रबंधन संस्थान (IIM) रोहतक को 'सर्वश्रेष्ठ सरकारी प्रबंधन संस्थान (खेल प्रबंधन)' का प्रतिष्ठित पुरस्कार दिया गया"),
      Q(62, "हरियाणा पुलिस ने सड़क सुरक्षा के लिए आईआईटी मद्रास के सहयोग से कौन सा एप लांच किया है?", ["(A) संजया एप", "(B) सुरक्षा मित्र एप", "(C) यातायात एप", "(D) रोड सेफ्टी एप"], 0, "• हरियाणा पुलिस ने सड़क सुरक्षा और इमरजेंसी रिस्पांस सिस्टम को आधुनिक तकनीक से जोड़ते हुए एक ऐतिहासिक परिवर्तनकारी पहल शुरू की है<br>• आईआईटी मद्रास के सहयोग से विकसित संजया एप की सहायता से अब सड़क दुर्घटनाओं का विश्लेषण होगा"),
      Q(63, "किस हरियाणवी व्यक्ति को राष्ट्रीय जांच एजेंसी (NIA) का महानिदेशक नियुक्त किया गया है?", ["(A) महेंद्र जोशी", "(B) राकेश अग्रवाल", "(C) दीपेश लहरी", "(D) निशांत अग्रवाल"], 1, "• हाल ही में, 1994 बैच के हिमाचल प्रदेश कैडर के आईपीएस अधिकारी राकेश अग्रवाल को राष्ट्रीय जांच एजेंसी (NIA) के नए महानिदेशक के रूप में नियुक्त किया गया है<br>• राकेश अग्रवाल मूल रूप से हरियाणा के हिसार जिले के पाबड़ा गाँव के रहने वाले हैं"),
      Q(64, "हरियाणा कैडर के कौन से IPS अधिकारी ITBP के नए महानिदेशक नियुक्त किए गए हैं?", ["(A) प्रवीण कुमार", "(B) शशांक सिंह", "(C) शत्रुजीत सिंह कपूर", "(D) अरविन्द चौधरी"], 2, "• हाल ही में, हरियाणा कैडर के 1990 बैच के वरिष्ठ IPS अधिकारी शत्रुजीत सिंह कपूर को इंडो-तिब्बतन बॉर्डर पुलिस (ITBP) का नया महानिदेशक नियुक्त किया गया है"),
      Q(65, "हरियाणा सरकार ने EWS की वार्षिक आय सीमा बढ़ाकर अब कितनी कर दी है?", ["(A) 7 लाख", "(B) 8 लाख", "(C) 9 लाख", "(D) 10 लाख"], 1, "• हरियाणा सरकार ने आर्थिक रूप से कमजोर वर्ग (EWS) के लिए वार्षिक पारिवारिक आय सीमा को 6 लाख रुपए से बढ़ाकर 8 लाख रुपए कर दिया है"),
      Q(66, "हरियाणा के किस जिले में स्थित एनडीआरआई ने गाय की एक नई नस्ल 'करण फ्राइज' विकसित की है?", ["(A) करनाल", "(B) हिसार", "(C) अम्बाला", "(D) सिरसा"], 0, "• हरियाणा के करनाल स्थित नेशनल डेयरी रिसर्च इंस्टीट्यूट (NDRI) के वैज्ञानिकों ने गाय की एक नई नस्ल 'करण फ्राइज' विकसित की है<br>• यह गाय विदेशी 'होल्सटीन फ्रिजियन' और भारतीय 'थारपारकर' का मेल है"),
      Q(67, "किस हरियाणवी महिला हॉकी खिलाड़ी को हीरो हॉकी इंडिया लीग 2025-26 में सर्वश्रेष्ठ खिलाड़ी चुना गया?", ["(A) शर्मीला रानी", "(B) दीपिका कुमारी", "(C) नवनीत कौर", "(D) हरमनप्रीत कौर"], 2, "• कुरुक्षेत्र जिले के शाहाबाद की ओलंपियन हॉकी खिलाड़ी नवनीत कौर को हीरो हॉकी इंडिया लीग 2025-26 में शानदार कप्तानी और 4 गोल करने के लिए 'प्लेयर ऑफ द टूर्नामेंट' (सर्वश्रेष्ठ खिलाड़ी) चुना गया है"),
      Q(68, "मधुमक्खी पालन नीति को अपनाने वाला देश का पहला राज्य कौन सा बना है?", ["(A) मध्य प्रदेश", "(B) उत्तर प्रदेश", "(C) पंजाब", "(D) हरियाणा"], 3, "• हरियाणा मधुमक्खी पालन नीति को अपनाने वाला देश का पहला राज्य बन गया है<br>• इस नीति के प्रभावी क्रियान्वयन से राज्य में शहद उत्पादन को बढ़ावा मिला है"),
      Q(69, "किस मंत्रालय ने महिलाओं और बच्चों से जुड़ी योजनाओं के लिए 'पंखुड़ी' डिजिटल पोर्टल लॉन्च किया?", ["(A) रक्षा मंत्रालय", "(B) महिला एवं बाल विकास मंत्रालय", "(C) गृह मंत्रालय", "(D) विदेश मंत्रालय"], 1, "• महिला एवं बाल विकास मंत्रालय ने महिलाओं और बच्चों से जुड़ी योजनाओं के लिए 'पंखुड़ी' डिजिटल पोर्टल लॉन्च किया है<br>• यह सिंगल विंडो प्लेटफॉर्म सरकार, नागरिकों, एनजीओ, कॉर्पोरेट और एनआरआई को जोड़ता है"),
      Q(70, "हरियाणा में हाल ही में, किसे भावांतर भरपाई योजना में शामिल किया गया है?", ["(A) शहतूत", "(B) जामुन", "(C) अंगूर", "(D) शहद"], 3, "• हरियाणा सरकार ने मधुमक्खी पालकों को आर्थिक सुरक्षा प्रदान करने की दिशा में एक महत्वपूर्ण कदम उठाते हुए भावांतर भरपाई योजना के तहत शहद के लिए संरक्षित मूल्य तय किया है"),
      Q(71, "उद्यम की स्थापना के लिए सरकार कितने रुपए तक की सब्सिडी देती है?", ["(A) 10 लाख", "(B) 15 लाख", "(C) 20 लाख", "(D) 25 लाख"], 0, "• सरकार की ओर से प्रधानमंत्री सूक्ष्म खाद्य उद्योग उन्नयन योजना के तहत उद्योगपतियों को सब्सिडी दी जाती है<br>• उद्योगपति योजना के तहत सूक्ष्म खाद्य प्रसंस्करण उद्यम की स्थापना या बढ़ाने के लिए 35% या अधिकतम 10 लाख रुपए तक सब्सिडी के लिए आवेदन कर सकते हैं"),
      Q(72, "वर्ष 2025 में साइबर धोखाधड़ी से प्राप्त धन को सुरक्षित करने में हरियाणा पुलिस ने देश में कौन सा स्थान प्राप्त किया है?", ["(A) पहला", "(B) दूसरा", "(C) तीसरा", "(D) चौथा"], 0, "• वर्ष 2025 में हरियाणा पुलिस ने साइबर अपराध से ठगी गई राशि को सुरक्षित कराने के क्षेत्र में अभूतपूर्व सफलता दर्ज करते हुए देश में प्रथम प्राप्त किया है"),
      Q(73, "9वीं एलीट महिला सीनियर नेशनल बॉक्सिंग चैंपियनशिप में मीनाक्षी हुड्डा ने कौन सा पदक जीता?", ["(A) स्वर्ण पदक", "(B) रजत पदक", "(C) कांस्य पदक", "(D) इनमें से कोई नहीं"], 0, "• रोहतक जिले की मीनाक्षी हुड्डा ने 48 किलोग्राम भार वर्ग के फाइनल मुकाबले में रेलवे की खिलाड़ी मंजू को 5-0 से हराकर 9वीं एलीट महिला सीनियर नेशनल बॉक्सिंग चैंपियनशिप 2026 में स्वर्ण पदक अपने नाम किया"),
      Q(74, "किस हरियाणवी ने 9:40 घंटे में अरब सागर में चैनल पार कर रिकॉर्ड बनाया?", ["(A) अतुल श्रीवास्तव", "(B) विमल पाहुजा", "(C) मंजीत कादियान", "(D) अजित नैन"], 2, "• भारत के विश्व रिकॉर्डधारी और बहादुरगढ़ के गांव दुबलधन के मंजीत कादियान ने 9 जनवरी 2026 को एक नया कीर्तिमान स्थापित किया<br>• शारीरिक रूप से दिव्यांग होने के बावजूद मंजीत ने अरब सागर में धरमतर जेट्टी से गेटवे ऑफ इंडिया तक चैनल स्विम को मात्र 9 घंटे 40 मिनट में सफलतापूर्वक पूरा करके रिकॉर्ड बनाया"),
      Q(75, "केन्द्रीय गृह मंत्री अमित शाह ने हरियाणा के किस शहर में एनएसजी के राष्ट्रीय आईईडी डेटा प्रबंधन प्लेटफॉर्म का शुभारंभ किया?", ["(A) कलेसर", "(B) पिहोवा", "(C) सोहना", "(D) मानेसर"], 3, "• केंद्रीय गृह मंत्री अमित शाह ने 9 जनवरी 2026 को गुरुग्राम जिले में स्थित एनएसजी मानेसर में नेशनल आईईडी डाटा मैनेजमेंट सिस्टम (NIDMS) का वर्चुअल शुभारंभ किया"),
      Q(76, "हरियाणा सरकार ने लंबित म्यूटेशन निपटाने के लिए किस अभियान की शुरुआत की?", ["(A) म्यूटेशन निपटान कार्यक्रम", "(B) जलसा-ए-आम", "(C) रेवेन्यू सलूशन मंच", "(D) जलसा-ए-खास"], 1, "• हरियाणा सरकार ने वर्ष 2026 के जनवरी महीने में समयबद्ध राज्यव्यापी अभियान 'जलसा-ए-आम' की शुरुआत की है, जिसका उद्देश्य इंतकाल (जमीन के मालिकाना हक का बदलाव) के पुराने और लंबित मामलों का त्वरित समाधान करना है"),
      Q(77, "हरियाणा के मुख्यमंत्री ने डेटा-आधारित निर्णय समर्थन प्रणाली के किस पोर्टल की शुरुआत की?", ["(A) नीव", "(B) दीक्षा", "(C) ई-पाठशाला", "(D) स्वर्ण"], 0, "• मुख्यमंत्री नायब सैनी ने 8 जनवरी 2026 को पंचकूला में आयोजित ज्ञानसेतु एमओयू एक्सचेंज कार्यक्रम में नेशनल एजुकेशन इवैल्यूएशन एंड वैलिडेशन (नीव) पोर्टल का शुभारंभ किया"),
      Q(78, "खेलो इंडिया बीच गेम्स 2026 में हरियाणा की महिला टीम ने सेपक टकरा खेल में कौन सा पदक जीता?", ["(A) स्वर्ण पदक", "(B) रजत पदक", "(C) कांस्य पदक", "(D) इनमें से कोई नहीं"], 1, "• घोघला बीच, दीव में खेले गए खेलो इंडिया बीच गेम्स 2026 के फाइनल मुकाबले में हरियाणा की महिला सेपक टकरा टीम ने बिहार की टीम को 2-1 से हराकर खिताब अपने नाम किया"),
      Q(79, "हरियाणा स्टेट लेवल एनवायरमेंट इम्पैक्ट असेसमेंट अथॉरिटी का चेयरमैन किसे नियुक्त किया गया है?", ["(A) देवदत्त निलेकनी", "(B) अंकुर गुप्ता", "(C) सुरेश गोयल", "(D) संजय सैनी"], 1, "• रिटायर्ड आईएएस अधिकारी अंकुर गुप्ता को हरियाणा स्टेट लेवल एनवायरमेंट इम्पैक्ट असेसमेंट अथॉरिटी (SEIAA) का नया चेयरमैन नियुक्त किया गया है"),
      Q(80, "8 जनवरी 2026 को पंजाब एवं हरियाणा हाईकोर्ट में किन दो नए अतिरिक्त जजों ने शपथ ग्रहण की?", ["(A) जस्टिस अनमोल भटेजा और जस्टिस कमला", "(B) जस्टिस कुलवंत देसाई और जस्टिस आशिमा दलाल", "(C) जस्टिस रमेश चंद्र डिमरी और जस्टिस नीरजा कुलवंत कतसन", "(D) जस्टिस अशोक गोदारा और जस्टिस सुमित्रा कुमारी"], 2, "• कानून एवं न्याय मंत्रालय के न्याय विभाग द्वारा जारी अधिसूचना के अनुसार राष्ट्रपति ने डिस्ट्रिक्ट एंड सेशन जज रमेश चंद्र डिमरी और नीरजा कुलवंत कतसन को पंजाब एवं हरियाणा हाई कोर्ट का अतिरिक्त न्यायाधीश नियुक्त किया है"),
      
      // Newly added questions from 81 to 100
      Q(81, "हरियाणा के किस शहर में 10 हजार एकड़ में सैटेलाइट सिटी बसाई जाएगी?", ["(A) खरखौदा", "(B) सोहना", "(C) घरौंडा", "(D) बहल"], 0, "• सोनीपत जिला के उपमंडल खरखौदा में 10 हजार एकड़ क्षेत्र में सैटेलाइट शहर बसाने की योजना है<br>• इसके साथ-साथ राई में हॉल सेल मार्केट बनाई जाएगी<br>• उस शहर को सैटेलाइट सिटी कहते हैं, जिसे महानगर के आसपास योजनाबद्ध तरीके से विकसित किया जाता है, ताकि मुख्य शहर से जनसंख्या, ट्रैफिक, आवास व रोजगार का दबाव कम किया जा सके"),
      Q(82, "सर्वोच्च न्यायालय के मुख्य न्यायाधीश सूर्यकांत ने 9-10 जनवरी 2026 को हरियाणा के किन दो जिलों में एसडीजेएम न्यायालय का उद्घाटन किया?", ["(A) फरीदाबाद और पलवल", "(B) हिसार और हांसी", "(C) सिरसा और अम्बाला", "(D) सोनीपत और यमुनानगर"], 1, "• देश के सर्वोच्च न्यायालय के मुख्य न्यायाधीश सूर्यकांत 9 और 10 जनवरी 2026 को हिसार और हांसी जिले के दौरे पर रहे<br>• यहां उन्होंने हिसार जिले के बरवाला में नवस्थापित एसडीजेएम न्यायालय का उद्घाटन एवं न्यायिक परिसर के शिलान्यास किया और हांसी जिले के नारनौंद में नवस्थापित एसडीजेएम न्यायालय के उद्घाटन एवं न्यायिक परिसर का भी शिलान्यास किया"),
      Q(83, "केंद्र सरकार ने हरियाणा के किन दो जिलों में एआई के एक्सीलेंस सेंटर बनाने को मंजूरी प्रदान की है?", ["(A) जींद और रोहतक", "(B) सिरसा और पलवल", "(C) गुरुग्राम और पंचकूला", "(D) भिवानी और सोनीपत"], 2, "• केंद्र सरकार ने हरियाणा के गुरुग्राम जिले में उद्योग और पंचकूला जिले में ऑफिस कार्यों पर आधारित एआई के एक्सीलेंस सेंटर बनाने को मंजूरी प्रदान कर दी है<br>• इस कार्य को लगभग 474 करोड़ रुपए की लागत से एआई फॉर रेजीलायंट जॉब्स अर्बन एयर क्वालिटी एंड नेक्स्ट जेनरेशन स्किल (अर्जुन) योजना के तहत किया जाएगा"),
      Q(84, "देश के भूमि-आबद्ध राज्यों में हरियाणा मछली उत्पादन में किस स्थान पर है?", ["(A) पहले", "(B) दूसरे", "(C) तीसरे", "(D) चौथे"], 1, "• हरियाणा देश के प्रमुख भूमि-आबद्ध (लैंडलॉक्ड) मछली उत्पादक राज्यों में दूसरे स्थान पर है<br>• भूमि-आबद्ध राज्यों में पंजाब मछली उत्पादन में प्रथम स्थान पर है<br>• हरियाणा ने 23,850 हेक्टेयर जल क्षेत्र से कुल 2.04 लाख मीट्रिक टन मछली का उत्पादन किया है"),
      Q(85, "हरियाणा के किस विश्वविद्यालय में कृषि विश्वविद्यालयों के कुलपतियों का दो दिवसीय 49वां सम्मेलन आयोजित किया गया?", ["(A) महर्षि दयानंद विश्वविद्यालय", "(B) चौधरी देवीलाल विश्वविद्यालय", "(C) कुरुक्षेत्र विश्वविद्यालय", "(D) चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय"], 3, "• हिसार जिले में स्थित चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय में 5 और 6 जनवरी 2026 को कृषि विश्वविद्यालयों के कुलपतियों के दो दिवसीय 49वें सम्मेलन का आयोजन किया गया<br>• इंडियन एग्रीकल्चरल यूनिवर्सिटी संगठन (आईएयूए) 1967 से कृषि विश्वविद्यालयों को एक ऐसा मंच प्रदान कर रही है जहां विश्वविद्यालय अपने कार्यक्षेत्र में कृषि से जुड़ी समस्याओं पर मंथन हो रहा है"),
      Q(86, "राष्ट्रीय अपराध रिकॉर्ड ब्यूरो (NCRB) द्वारा जारी ICJS 2.0 राष्ट्रीय रैंकिंग में हरियाणा पुलिस ने देश में कौन सा स्थान मिला?", ["(A) पहला", "(B) दूसरा", "(C) तीसरा", "(D) चौथा"], 1, "• उत्तराखंड ने राष्ट्रीय अपराध रिकॉर्ड ब्यूरो (NCRB) द्वारा जारी अपराध और आपराधिक ट्रैकिंग नेटवर्क सिस्टम (CCTNS) और इंटर-ऑपरेबल क्रिमिनल जस्टिस सिस्टम (ICJS) प्रोग्रेस डैशबोर्ड में 93.46 के स्कोर के साथ ICJS 2.0 में पहला स्थान हासिल किया<br>• हरियाणा 93.41 के साथ दूसरे स्थान पर रहा, जबकि असम ने 93.16 के साथ तीसरा स्थान हासिल किया"),
      Q(87, "प्रो कुश्ती लीग में खरीदी जाने वाली भारत की सबसे महंगी रेसलर कौन बनी है?", ["(A) अंतिम पंघाल", "(B) तपस्या गहलावत", "(C) निशा दहिया", "(D) अंजलि दहिया"], 0, "• प्रो कुश्ती लीग 2026 की बोली में दो बार की विश्व कुश्ती चैम्पियनशिप की पदक विजेता हरियाणा की अंतिम पंघाल को उत्तर प्रदेश डोमिनेटर्स ने 52 लाख रुपए में खरीदा<br>• इसी के साथ वे भारत की सबसे महंगी खिलाड़ी बन गई<br>• पुरुष वर्ग में अमन सहरावत को मुंबई टाइगर्स ने 51 लाख रुपए की बोली में खरीदा और वे सबसे महंगे भारतीय पुरुष पहलवान बने"),
      Q(88, "किस हरियाणवी पर्वतारोही ने 30 दिसम्बर 2025 को विश्व की सर्वोच्च चोटी माउंट एवरेस्ट के बेस कैंप पर भीषण ठंड और -40 डिग्री तापमान में भारतीय तिरंगा फहराया?", ["(A) सुनील", "(B) रोहताश बिश्नोई", "(C) नरेंद्र कुमार", "(D) किरण कुमार"], 2, "• हिसार जिले के गांव मिंगनी खेड़ा निवासी प्रसिद्ध पर्वतारोही नरेंद्र कुमार ने 30 दिसम्बर 2025 को विश्व की सर्वोच्च चोटी माउंट एवरेस्ट के बेस कैंप (5,364 मीटर) पर भीषण ठंड और 40 डिग्री सेल्सियस तापमान में भारतीय तिरंगा फहराकर देश का मान बढ़ाया<br>• पर्वतारोही नरेंद्र कुमार प्रधानमंत्री नरेंद्र मोदी की 'फिट इंडिया' मुहिम के ब्रांड एंबेसडर भी हैं"),
      Q(89, "हरियाणा में वर्ष 2025 में लिंगानुपात कितना रहा?", ["(A) 896", "(B) 907", "(C) 923", "(D) 938"], 2, "• हरियाणा में वर्ष 2024 की तुलना में वर्ष 2025 में ज्यादा बेटियां पैदा हुई, जिसके परिणाम स्वरूप लिंगानुपात 910 से बढ़कर 923 पहुंच गया<br>• प्रदेश के सभी जिलों में 971 लिंगानुपात के साथ पंचकूला टॉप पर रहा"),
      Q(90, "हरियाणा सरकार ने सरकारी पत्राचार एवं आधिकारिक कार्यों में किन शब्दों का प्रयोग न करने के निर्देश दिए हैं?", ["(A) हरिजन", "(B) गिरिजन", "(C) हरिजन और गिरिजन", "(D) इनमें से कोई नहीं"], 2, "• हरियाणा सरकार ने सभी विभागों को निर्देश दिए हैं कि अनुसूचित जातियों एवं अनुसूचित जनजातियों के संदर्भ में सरकारी पत्राचार तथा अन्य आधिकारिक कार्यों में 'हरिजन' और 'गिरिजन' जैसे शब्दों का प्रयोग न करें<br>• सरकार ने निर्देशों में स्पष्ट किया है कि भारत के संविधान में अनुसूचित जाति एवं अनुसूचित जनजाति के लिए इन शब्दों का प्रयोग नहीं किया गया है"),
      Q(91, "हरियाणा सरकार ने जनवरी 2026 में कितनी नई नगर पालिका बनाई हैं?", ["(A) तीन", "(B) पांच", "(C) सात", "(D) नौ"], 0, "• हरियाणा सरकार ने क्षेत्र के समुचित विकास और बुनियादी सुविधाओं में सुधार करने के लिए प्रदेश में तीन नई नगर पालिका बनाई हैं<br>• इनमें कुंजपुरा (करनाल), मतलौडा (पानीपत) और शहजादपुर (अम्बाला) को नगर पालिका का दर्जा दिया है"),
      Q(92, "हरियाणा के किस विश्वविद्यालय ने अपने भवनों के नाम महापुरुषों के नाम पर रखने का प्रस्ताव पारित किया है?", ["(A) चौधरी बंसीलाल विश्वविद्यालय", "(B) कुरुक्षेत्र यूनिवर्सिटी", "(C) महर्षि दयानंद विश्वविद्यालय", "(D) लुवास विश्वविद्यालय"], 1, "• कुरुक्षेत्र यूनिवर्सिटी (केयू) अपने भवनों को नए नाम देगा, इस संबंध में प्रस्ताव को यूनिवर्सिटी की कार्यकारिणी परिषद की बैठक में पारित किया<br>• ये नाम महापुरुषों, स्वतंत्रता सेनानियों, वैज्ञानिकों, शिक्षाविदों और विश्व विशेषज्ञों के नाम पर रखे जाएंगे"),
      Q(93, "हरियाणा सरकार ने सरकारी स्कूलों के बच्चों के 10वीं-12वीं में कितने % अंक लाने पर उनकी माँ को लाडो लक्ष्मी योजना का लाभ देने की घोषणा की है?", ["(A) 80%", "(B) 85%", "(C) 90%", "(D) 95%"], 0, "• हरियाणा सरकार ने पंडित दीन दयाल लाडो लक्ष्मी योजना का विस्तार करते हुए इसमें तीन कैटेगरी और जोड़ी हैं, जिनकी आय सीमा 1.80 लाख रुपए तक की गई है<br>• पहली - ऐसे परिवारों के बच्चे, जो सरकारी स्कूलों में पढ़ रहे हैं और 10वीं और 12वीं कक्षा में 80 प्रतिशत से ज्यादा नंबर लेकर आते हैं, उनकी माताओं को लाभ मिलेगा"),
      Q(94, "9वीं एलीट महिला राष्ट्रीय बॉक्सिंग चैंपियनशिप 2025 में स्वर्ण पदक जीतकर 10 सीनियर राष्ट्रीय खिताब जीतने वाली पहली भारतीय महिला बॉक्सर कौन बनी है?", ["(A) नैना देवी", "(B) पूजा रानी बोहरा", "(C) कमला रानी", "(D) दीपिका चौधरी"], 1, "• भिवानी की अंतर्राष्ट्रीय मुक्केबाज पूजा रानी बोहरा ने 10 जनवरी 2026 को उत्तर प्रदेश के ग्रेटर नोएडा में आयोजित 9वीं एलीट महिला राष्ट्रीय मुक्केबाजी चैंपियनशिप में 75-80 किलोग्राम लाइट हैवीवेट वर्ग में रोहतक की नैना को हराकर स्वर्ण पदक जीतकर इतिहास रच दिया<br>• इसके साथ ही पूजा सीनियर वर्ग में राष्ट्रीय स्तर पर 10 खिताब जीतने वाली पहली भारतीय महिला मुक्केबाज बन गई"),
      Q(95, "हरियाणा में सरकारी अस्पतालों की आंतरिक सेवाओं को सुव्यवस्थित बनाने के लिए किस पोर्टल से जोड़ा जा रहा है?", ["(A) नेक्स जेन-ई हॉस्पिटल पोर्टल", "(B) हर हॉस्पिटल पोर्टल", "(C) हॉस्पिटल ऑडिट पोर्टल", "(D) हरियाणा हॉस्पिटल अकाउंट पोर्टल"], 0, "• प्रदेश में नेक्स जेन-ई हॉस्पिटल पोर्टल से स्वास्थ्य केंद्रों को जोड़ने व जनता की आभा आईडी जनरेट करने का काम तेजी से चल रहा है<br>• भविष्य में इसी प्रक्रिया से मरीजों को एकीकृत स्वास्थ्य सेवाएं उपलब्ध होंगी"),
      Q(96, "हरियाणा का पहला 'हॉस्पिटल ऑन व्हील्स' किस जिले में शुरू किया गया है?", ["(A) फरीदाबाद", "(B) हिसार", "(C) अम्बाला", "(D) रेवाड़ी"], 0, "• केंद्रीय राज्यमंत्री कृष्णपाल गुर्जर ने 1 जनवरी 2026 को फरीदाबाद में 'हॉस्पिटल ऑन व्हील्स' की दो अत्याधुनिक चिकित्सा बसों को हरी झंडी दिखाकर रवाना किया<br>• इनके शुरू होने से अब उद्योगों में जाकर मजदूरों की स्वास्थ्य जांच होगी"),
      Q(97, "63 एकड़ भूमि में बनने वाला एचएयू का पोषक अनाज अनुसंधान केंद्र हरियाणा के किस जिले के गोकलपुरा में शुरू होगा?", ["(A) करनाल", "(B) सिरसा", "(C) चरखी दादरी", "(D) भिवानी"], 3, "• चौधरी चरण सिंह हरियाणा कृषि विश्वविद्यालय हिसार का 63 एकड़ भूमि पर बनने वाला पोषक अनाज अनुसंधान केन्द्र भिवानी जिला के गोकलपुरा गांव में आरंभ होगा<br>• यह पोषक अनाज अनुसंधान केन्द्र प्रदेश सरकार की आर्थिक सहायता से स्थापित किया जा रहा है"),
      Q(98, "केंद्र सरकार ने किसानों की यूनिक आईडी बनाने के लिए कौन सा पोर्टल लांच किया है?", ["(A) किसान यूआईडी पोर्टल", "(B) एग्रो फार्म पोर्टल", "(C) किसान आधार पोर्टल", "(D) एग्री स्टैक पोर्टल"], 3, "• केंद्र सरकार के डिजिटल एग्रीकल्चर मिशन के तहत जिन किसानों के नाम पर खेती की जमीन है, उनकी विशिष्ट पहचान (आईडी) बनाई जाएगी<br>• इसके लिए 'एग्री स्टैक पोर्टल' पर पंजीकरण की प्रक्रिया शुरू की गई है"),
      Q(99, "देश का पहला आद्य महालक्ष्मी मंदिर हरियाणा में कहां बनाया जा रहा है?", ["(A) रतिया", "(B) तोशाम", "(C) अग्रोहा", "(D) टोहाना"], 2, "• हिसार जिले में स्थित अग्रवंशी महाराजा अग्रसेन की ऐतिहासिक अग्रोहा नगरी की पवित्र भूमि पर देश का पहला महालक्ष्मी एवं अष्टलक्ष्मी का मंदिर बनाया जा रहा है<br>• यह देश का पहला ऐसा मंदिर है जिसमें आद्य महालक्ष्मी के साथ माता लक्ष्मी के 8 स्वरूप की चांदी से बनी भव्य प्रतिमाएं चांदी के सिंहासन पर विराजमान होंगी"),
      Q(100, "हरियाणा पुलिस के नए डीजीपी कौन नियुक्त किए गए हैं?", ["(A) अजय सिंघल", "(B) अरविंद्र सिंह चावला", "(C) आलोक मित्तल", "(D) निर्मल चौधरी"], 0, "• हरियाणा सरकार ने रेवाड़ी के मूल निवासी 1992 बैच के आईपीएस अजय सिंघल को प्रदेश का नया डीजीपी नियुक्त किया है<br>• उन्होंने 1 जनवरी 2026 को पदभार ग्रहण किया और वे दिसम्बर 2027 तक पद पर रहेंगे")
    ];

    let currentIndex = 0;
    let correctCount = 0;
    let wrongCount = 0;
    let attemptedCount = 0;
    let userAnswers = Array(questionsData.length).fill().map(() => ({ selectedIndex: null, isExpVis: false }));

    function initQuiz() {
      renderQuestion(currentIndex);
      updateScoreBoard();
    }

    function renderQuestion(index) {
      const q = questionsData[index];
      const attempt = userAnswers[index];
      const isAtt = attempt.selectedIndex !== null;

      document.getElementById('questionCounterText').textContent = `Question ${index + 1} / ${questionsData.length}`;

      let html = `
        <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm w-full">
          <div class="flex items-start justify-between gap-4 mb-5">
            <div class="flex items-start gap-3">
              <span class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 flex items-center justify-center font-bold text-sm shrink-0">${q.id}</span>
              <h2 class="text-base font-semibold text-slate-900 dark:text-white pt-1">${q.sentence}</h2>
            </div>
            <span class="${isAtt ? '' : 'hidden'} text-xs font-semibold px-2 py-1 rounded-full ${isAtt && attempt.selectedIndex === q.correct ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${isAtt ? (attempt.selectedIndex === q.correct ? '✓ Correct' : '✕ Incorrect') : ''}
            </span>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
            ${q.options.map((opt, optIdx) => {
                let btnCls = 'text-left p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50/50 dark:bg-slate-800/40 font-medium text-sm hover:bg-slate-100 dark:hover:bg-slate-800 flex items-start gap-3';
                let bCls = 'w-6 h-6 rounded-md bg-white dark:bg-slate-700 border border-slate-300 flex items-center justify-center text-xs font-bold shrink-0';
                let bChar = ['A', 'B', 'C', 'D'][optIdx];

                if (isAtt) {
                    if (optIdx === q.correct) {
                        btnCls = 'text-left p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-emerald-900 dark:text-emerald-400 font-medium text-sm flex items-start gap-3';
                        bCls = 'w-6 h-6 rounded-md bg-emerald-500 text-white flex items-center justify-center text-xs font-bold shrink-0 border-0';
                        bChar = '✓';
                    } else if (optIdx === attempt.selectedIndex) {
                        btnCls = 'text-left p-3.5 rounded-xl border-2 border-rose-500 bg-rose-50 text-rose-900 dark:text-rose-400 font-medium text-sm flex items-start gap-3';
                        bCls = 'w-6 h-6 rounded-md bg-rose-500 text-white flex items-center justify-center text-xs font-bold shrink-0 border-0';
                        bChar = '✕';
                    } else {
                        btnCls = 'text-left p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 opacity-50 flex items-start gap-3 cursor-not-allowed';
                    }
                }
                return `<button onclick="handleOptionClick(${index}, ${optIdx})" class="${btnCls}"><span class="${bCls} mt-0.5">${bChar}</span><span class="flex-1">${opt.replace(/^\([A-D]\)\s*/, '')}</span></button>`;
            }).join('')}
          </div>

          <div id="expBox" class="${isAtt && attempt.isExpVis ? '' : 'hidden'} p-4 rounded-xl bg-indigo-50/50 dark:bg-slate-800/60 border-l-4 border-indigo-500 text-sm">
             <div class="font-bold text-indigo-700 dark:text-indigo-300 mb-2">Explanation (व्याख्या):</div>
             <div class="text-slate-700 dark:text-slate-200 leading-loose">${q.exp}</div>
          </div>
        </article>`;

      document.getElementById('quizContainer').innerHTML = html;
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === questionsData.length - 1;
    }

    function handleOptionClick(qIdx, optIdx) {
      const attempt = userAnswers[qIdx];
      if (attempt.selectedIndex === null) {
        attempt.selectedIndex = optIdx;
        attempt.isExpVis = true;
        attemptedCount++;
        if (optIdx === questionsData[qIdx].correct) correctCount++; else wrongCount++;
        updateScoreBoard();
        renderQuestion(qIdx);
      } else {
        attempt.isExpVis = !attempt.isExpVis;
        renderQuestion(qIdx);
      }
    }

    function changeQuestion(dir) {
      const newIdx = currentIndex + dir;
      if (newIdx >= 0 && newIdx < questionsData.length) {
        currentIndex = newIdx;
        renderQuestion(currentIndex);
        updateScoreBoard();
      }
    }

    function updateScoreBoard() {
      document.getElementById('headerCorrect').textContent = `Correct: ${correctCount}`;
      document.getElementById('headerWrong').textContent = `Wrong: ${wrongCount}`;
      document.getElementById('headerAttempted').textContent = `Attempted: ${attemptedCount}/${questionsData.length}`;
      document.getElementById('quizProgressBar').style.width = `${((currentIndex + 1) / questionsData.length) * 100}%`;
    }

    function resetAllQuiz() {
      if (confirm("Reset test?")) {
        correctCount = wrongCount = attemptedCount = currentIndex = 0;
        userAnswers = Array(questionsData.length).fill().map(() => ({ selectedIndex: null, isExpVis: false }));
        initQuiz();
      }
    }

    function toggleDarkMode() {
      const isD = document.documentElement.classList.toggle('dark');
      document.getElementById('sunIcon').classList.toggle('hidden', !isD);
      document.getElementById('moonIcon').classList.toggle('hidden', isD);
    }
    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    }
    
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') changeQuestion(1);
      if (e.key === 'ArrowLeft') changeQuestion(-1);
    });

    window.onload = () => { document.documentElement.classList.add('dark'); initQuiz(); };
  </script>
</body>
</html>
