<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>HSSC ENGLISH HINDI PYQ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:#f3f6fb;
  color:#172033;
  font-family:'Poppins',sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
}


/* =========================
   TOP
========================= */

.top{
  background:linear-gradient(
    135deg,
    #119d59,
    #08763f
  );

  color:white;

  border-radius:23px;

  padding:22px 17px 17px;

  box-shadow:0 8px 22px #0002;
}


/* TOP BUTTONS */

.top-buttons{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.top button{
  border:0;

  background:#ffffff2b;

  color:white;

  border-radius:14px;

  padding:10px 15px;

  font-size:16px;

  font-family:'Poppins',sans-serif;

  cursor:pointer;
}

.top button:active{
  transform:scale(.96);
}


/* TITLE */

.title{
  margin:22px 0 3px;

  font-family:'Baloo 2',sans-serif;

  font-size:34px;

  line-height:1.1;

  font-weight:800;
}

.subtitle{
  margin:0;

  font-size:17px;
}


/* SEARCH */

.search{
  width:100%;

  margin-top:18px;

  padding:13px 16px;

  border:0;

  outline:0;

  border-radius:14px;

  font-size:16px;

  font-family:'Poppins',sans-serif;
}


/* =========================
   AVAILABLE
========================= */

.heading{
  margin:30px 5px 12px;

  font-family:'Baloo 2',sans-serif;

  font-size:31px;

  line-height:1;

  font-weight:800;
}

#status{
  color:#687386;

  font-size:16px;

  margin:0 5px 14px;
}

.grid{
  display:grid;

  gap:14px;
}


/* =========================
   CARDS
========================= */

.card{
  background:white;

  border-radius:21px;

  padding:18px 20px;

  box-shadow:0 4px 14px #14233c14;

  cursor:pointer;

  transition:.15s;
}

.card:active{
  transform:scale(.985);
}

.card-title{
  font-size:21px;

  font-weight:800;
}

.card-file{
  margin-top:4px;

  color:#737d8c;

  font-size:14px;
}

.folder .card-title{
  color:#087f46;
}


/* EMPTY */

.empty{
  background:white;

  padding:20px;

  border-radius:18px;

  color:#687386;
}


/* =========================
   VIEWER
========================= */

.viewer{
  display:none;

  position:fixed;

  inset:0;

  background:white;

  z-index:99999;
}

.viewer-bar{
  height:54px;

  background:#087f46;

  color:white;

  display:flex;

  align-items:center;

  gap:10px;

  padding:8px 10px;
}

.viewer-bar button{
  border:0;

  background:#ffffff25;

  color:white;

  border-radius:10px;

  padding:8px 12px;

  font-size:16px;
}

.viewer-title{
  flex:1;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  font-weight:700;
}

iframe{
  width:100%;

  height:calc(100vh - 54px);

  border:0;
}


/* =========================
   DARK MODE
========================= */

body.dark{
  background:#111827;

  color:#e5e7eb;
}

body.dark .card,
body.dark .empty{
  background:#1f2937;

  color:#e5e7eb;
}

body.dark .card-file,
body.dark #status{
  color:#aab3c2;
}

body.dark .search{
  background:#1f2937;

  color:white;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  body{
    padding:10px;
  }

  .top{
    padding:20px 15px 15px;

    border-radius:22px;
  }

  .title{
    font-size:31px;

    margin-top:20px;
  }

  .subtitle{
    font-size:16px;
  }

  .top button{
    font-size:15px;

    padding:9px 12px;
  }

  .heading{
    font-size:30px;

    margin-top:28px;
  }

  .card{
    padding:18px;

    border-radius:20px;
  }

  .card-title{
    font-size:20px;
  }

}

</style>

</head>


<body>


<div class="wrap">


<!-- =========================
     HEADER
========================= -->

<div class="top">

  <div class="top-buttons">

    <button onclick="goBack()">
      ← Back
    </button>

    <button onclick="fullScreen()">
      ⛶ Full Screen
    </button>

  </div>


  <div class="title">
    📚 HSSC ENGLISH HINDI PYQ
  </div>

  <p class="subtitle">
    सभी English और Hindi PYQ Tests यहाँ मिलेंगे
  </p>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 Test या Folder खोजें..."
    oninput="searchItems()"
  >

</div>


<!-- =========================
     AVAILABLE
========================= -->

<h2 class="heading">
  📁 Available
</h2>


<div id="status">
  Loading...
</div>


<div id="items" class="grid">
</div>


</div>


<!-- =========================
     TEST VIEWER
========================= -->

<div id="viewer" class="viewer">

  <div class="viewer-bar">

    <button onclick="closeTest()">
      ← Tests
    </button>

    <div
      id="viewerTitle"
      class="viewer-title">
      Test
    </div>

    <button onclick="fullScreen()">
      ⛶
    </button>

  </div>


  <iframe
    id="frame"
    allowfullscreen>
  </iframe>

</div>


<script>


/* =================================
   GITHUB SETTINGS
================================= */

const OWNER = "Golu171";

const REPO = "study-notes";

const ROOT = "HSSC ENGLISH HINDI PYQ";

const BRANCH = "main";


/* =================================
   API
================================= */

function api(path){

  return "https://api.github.com/repos/"
    + OWNER
    + "/"
    + REPO
    + "/contents/"
    + path
        .split("/")
        .map(
          encodeURIComponent
        )
        .join("/")
    + "?ref="
    + BRANCH;

}


/* =================================
   DATA
================================= */

let folders = [];

let files = [];


/* =================================
   CLEAN NAME
================================= */

function clean(name){

  return name
    .replace(/\.html$/i,"")
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =================================
   SAFE TEXT
================================= */

function esc(text){

  const d =
    document.createElement("div");

  d.textContent = text;

  return d.innerHTML;

}


/* =================================
   SORT
================================= */

function sortName(a,b){

  return a.name.localeCompare(
    b.name,
    undefined,
    {
      numeric:true,
      sensitivity:"base"
    }
  );

}


/* =================================
   LOAD
================================= */

async function load(){

  try{

    const response =
      await fetch(
        api(ROOT),
        {
          headers:{
            "Accept":
            "application/vnd.github+json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "GitHub API Error"
      );

    }


    const data =
      await response.json();


    folders =
      data
        .filter(
          x =>
            x.type === "dir"
        )
        .sort(sortName);


    files =
      data
        .filter(
          x =>
            x.type === "file" &&
            /\.html$/i.test(x.name) &&
            x.name.toLowerCase() !== "index.html"
        )
        .sort(sortName);


    document
      .getElementById("status")
      .textContent =
        folders.length
        + " Folder"
        + (
            folders.length === 1
            ? ""
            : "s"
          )
        + " + "
        + files.length
        + " HTML Test"
        + (
            files.length === 1
            ? ""
            : "s"
          )
        + " मिले";


    render();

  }


  catch(error){

    console.error(error);


    document
      .getElementById("status")
      .textContent =
        "Files load नहीं हो पाईं";


    document
      .getElementById("items")
      .innerHTML =
        '<div class="empty">' +
        'Internet check करके page फिर खोलें।' +
        '</div>';

  }

}


/* =================================
   RENDER
================================= */

function render(){

  const box =
    document.getElementById("items");


  box.innerHTML = "";


  /* FOLDERS */

  folders.forEach(folder => {

    const a =
      document.createElement("a");


    a.className =
      "card folder";


    a.style.textDecoration =
      "none";


    a.style.display =
      "block";


    /*
      EXACT GITHUB PAGES PATH
    */

    a.href =
      "/" +
      REPO +
      "/" +
      folder.path
        .split("/")
        .map(
          encodeURIComponent
        )
        .join("/")
      +
      "/";


    a.innerHTML =

      '<div class="card-title">' +
      '📁 ' +
      esc(
        clean(folder.name)
      ) +
      '</div>' +

      '<div class="card-file">' +
      'Folder खोलें →' +
      '</div>';


    box.appendChild(a);

  });


  /* HTML TESTS */

  files.forEach(file => {

    const d =
      document.createElement("div");


    d.className =
      "card";


    /*
      IMPORTANT:
      file.path इस्तेमाल होगा
      ताकि 404 न आए
    */

    d.onclick =
      () => openTest(file.path);


    d.innerHTML =

      '<div class="card-title">' +
      '📝 ' +
      esc(
        clean(file.name)
      ) +
      '</div>' +

      '<div class="card-file">' +
      esc(file.name) +
      '</div>';


    box.appendChild(d);

  });


  if(
    !folders.length &&
    !files.length
  ){

    box.innerHTML =
      '<div class="empty">' +
      'अभी कोई HTML Test या Folder नहीं मिला।' +
      '</div>';

  }

}


/* =================================
   SEARCH
================================= */

function searchItems(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const oldFolders =
    folders;

  const oldFiles =
    files;


  folders =
    oldFolders.filter(
      x =>
        x.name
          .toLowerCase()
          .includes(q)
    );


  files =
    oldFiles.filter(
      x =>
        x.name
          .toLowerCase()
          .includes(q)
    );


  render();


  folders =
    oldFolders;

  files =
    oldFiles;

}


/* =================================
   OPEN TEST
================================= */

function openTest(path){

  /*
    GitHub Pages:
    /study-notes/
    + exact GitHub file path
  */

  const url =
    location.origin
    + "/"
    + REPO
    + "/"
    + path
        .split("/")
        .map(
          encodeURIComponent
        )
        .join("/");


  const filename =
    path.split("/").pop();


  document
    .getElementById("frame")
    .src = url;


  document
    .getElementById("viewerTitle")
    .textContent =
      clean(filename);


  document
    .getElementById("viewer")
    .style.display =
      "block";

}


/* =================================
   CLOSE TEST
================================= */

function closeTest(){

  document
    .getElementById("viewer")
    .style.display =
      "none";


  document
    .getElementById("frame")
    .src = "";

}


/* =================================
   FULL SCREEN
================================= */

function fullScreen(){

  if(
    !document.fullscreenElement
  ){

    document
      .documentElement
      .requestFullscreen?.()
      .catch(
        ()=>{}
      );

  }

  else{

    document
      .exitFullscreen?.()
      .catch(
        ()=>{}
      );

  }

}


/* =================================
   BACK
================================= */

function goBack(){

  location.href =
    "/"
    + REPO
    + "/";

}


/* =================================
   DARK MODE
================================= */

function toggleDark(){

  document
    .body
    .classList
    .toggle("dark");


  localStorage.setItem(
    "darkMode",
    document.body.classList.contains(
      "dark"
    )
      ? "1"
      : "0"
  );

}


/* =================================
   START
================================= */

load();

</script>


</body>
  </html>
