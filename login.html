<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Notes — Login</title>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5f5,#f5f7fb);font-family:Arial,sans-serif;color:#172033;display:flex;align-items:center;justify-content:center;padding:18px}
.card{width:min(430px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 14px 40px rgba(25,45,55,.14)}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#1b4e52,#0e3336);color:#f5c84c;display:grid;place-items:center;font-size:30px;margin:auto}
h1{text-align:center;margin:15px 0 4px;font-size:28px}.sub{text-align:center;color:#667085;margin-bottom:24px}
.tabs{display:flex;background:#eef2f3;border-radius:13px;padding:4px;margin-bottom:20px}.tabs button{flex:1;border:0;background:transparent;padding:11px;border-radius:10px;font-weight:700}.tabs button.on{background:#fff;box-shadow:0 2px 8px #0001}
label{display:block;font-weight:700;margin:12px 0 7px}input{width:100%;padding:13px;border:1px solid #d5dbe3;border-radius:12px;font-size:16px;outline:none}input:focus{border-color:#4c8f92}
.primary{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;background:#1b4e52;color:#fff;font-size:16px;font-weight:800}
.msg{margin-top:15px;padding:11px;border-radius:11px;display:none;font-size:14px}.msg.ok{display:block;background:#e9f8ee;color:#176b35}.msg.err{display:block;background:#fff0f0;color:#a52222}
.demo{margin-top:18px;text-align:center;padding:12px;border-radius:14px;background:#fff8df;color:#765a00;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="logo">📚</div>
  <h1>STUDY NOTES</h1>
  <div class="sub">Login karke Mock Tests aur Rank access karein</div>
  <div class="tabs">
    <button id="loginTab" class="on" type="button">Login</button>
    <button id="signupTab" type="button">Create Account</button>
  </div>
  <form id="form">
    <div id="nameWrap" style="display:none">
      <label>Name</label><input id="name" autocomplete="name">
    </div>
    <label>Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label>Password</label>
    <input id="password" type="password" minlength="6" autocomplete="current-password" required>
    <button class="primary" id="submitBtn" type="submit">Login</button>
  </form>
  <div id="msg" class="msg"></div>
  <div class="demo">🎁 October 1–31: All Mock Tests FREE</div>
</div>
<script>
let signup=false;
const $=id=>document.getElementById(id);
function mode(v){
  signup=v;$("loginTab").classList.toggle("on",!v);$("signupTab").classList.toggle("on",v);
  $("nameWrap").style.display=v?"block":"none";$("name").required=v;
  $("submitBtn").textContent=v?"Create Account":"Login";
}
$("loginTab").onclick=()=>mode(false);$("signupTab").onclick=()=>mode(true);
function msg(t,ok=false){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")}
$("form").onsubmit=async e=>{
 e.preventDefault();msg("");
 try{
  const sb=await StudyNotesAuth.getClient();
  const email=$("email").value.trim(), password=$("password").value;
  if(signup){
    const name=$("name").value.trim()||"Student";
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name,name}}});
    if(error)throw error;
    if(data.session){
      await StudyNotesAuth.saveProfile(name);
      location.replace(new URLSearchParams(location.search).get("next")||"index.html");
    }else msg("Account ban gaya. Email inbox se verification link confirm karke Login karein.",true);
  }else{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    location.replace(new URLSearchParams(location.search).get("next")||"index.html");
  }
 }catch(e){msg(e.message||"Something went wrong")}
};
</script>
</body>
</html>
