<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Study Notes Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#07101d;--card:#151d2c;--input:#0d1220;--text:#f7f8fc;--muted:#9ba6bb;--gold:#f4c94f;--teal:#1d6668}
html,body{margin:0;min-height:100%;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{min-height:100dvh;display:grid;place-items:center;padding:14px}
.card{width:min(430px,100%);padding:30px 28px 24px;background:linear-gradient(145deg,#1a2435,#131a29);border:1px solid rgba(255,255,255,.12);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
.avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;border:4px solid #f5c51c;box-shadow:0 0 18px rgba(245,197,28,.35);margin-bottom:14px}
h1{margin:0;color:var(--gold);font-size:28px;font-weight:900;line-height:1.15}
.sub{margin:8px 0 22px;color:var(--muted);font-size:14px;line-height:1.35}
button{font-family:Poppins;cursor:pointer}
.google{width:100%;height:50px;border:0;border-radius:14px;font-size:15px;font-weight:800}
.google{background:#fff;color:#202737;display:flex;align-items:center;justify-content:center;gap:10px}
.google svg{width:20px;height:20px}
.status{min-height:18px;margin-top:7px;font-size:11px;font-weight:700}
.referral-box{position:relative;overflow:hidden;margin-top:22px;padding:20px 17px 16px;border:1px solid rgba(73,229,211,.48);border-radius:18px;background:linear-gradient(135deg,rgba(15,111,111,.28),rgba(37,28,75,.65));box-shadow:0 0 22px rgba(32,210,195,.12),inset 0 0 22px rgba(255,255,255,.025);animation:boxPulse 2.8s ease-in-out infinite}
.referral-box:before{content:"";position:absolute;top:-60%;left:-55%;width:45%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);transform:rotate(25deg);animation:shine 4s ease-in-out infinite;pointer-events:none}
.referral-icon{font-size:23px;color:#75f5e2;animation:twinkle 1.8s ease-in-out infinite}
.referral-title{margin:5px 0 10px;color:#ffe17b;font-size:15px;font-weight:900;letter-spacing:1px;text-shadow:0 0 12px rgba(255,214,87,.3)}
.referral-box p{position:relative;margin:7px 0;color:#e3f4f5;font-size:11px;line-height:1.65;font-weight:700;letter-spacing:.35px}
.referral-glow{margin-top:13px;color:#7df5df;font-size:10px;font-weight:800;letter-spacing:1px;animation:twinkle 2s infinite}
.telegram-cta{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;margin:15px auto 0;min-height:46px;padding:10px 16px;border-radius:13px;background:linear-gradient(135deg,#28a8e9,#167ac4);color:#fff;text-decoration:none;font-size:14px;font-weight:900;letter-spacing:.6px;box-shadow:0 7px 20px rgba(30,151,220,.3);animation:ctaPulse 2s ease-in-out infinite}
.telegram-cta:active{transform:scale(.98)}
@keyframes ctaPulse{0%,100%{box-shadow:0 7px 18px rgba(30,151,220,.22)}50%{box-shadow:0 7px 26px rgba(30,151,220,.5)}}
@keyframes boxPulse{0%,100%{box-shadow:0 0 15px rgba(32,210,195,.10)}50%{box-shadow:0 0 27px rgba(32,210,195,.28)}}
@keyframes shine{0%,35%{left:-60%}75%,100%{left:130%}}
@keyframes twinkle{0%,100%{opacity:.72;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@media(max-height:650px){.card{padding:22px 24px 18px}.avatar{width:66px;height:66px;margin-bottom:9px}h1{font-size:24px}.sub{margin:6px 0 15px}.google{height:45px}.referral-box{margin-top:14px;padding:14px 12px}}
</style>
</head>
<body>
<section class="card">
  <img class="avatar" src="https://files.catbox.moe/myz60w.jpg" alt="Study Notes">
  <h1 id="title">Welcome Student</h1>
  <div class="sub" id="subtitle">Login to practice Mock Tests &amp; PYQs</div>

  <button class="google" id="googleBtn" type="button">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M21.35 12.23c0-.78-.07-1.53-.22-2.23H12v4.22h5.24a4.48 4.48 0 0 1-1.94 2.94v2.44h3.14c1.84-1.69 2.91-4.18 2.91-7.37z"/><path fill="#34A853" d="M12 21.99c2.63 0 4.84-.87 6.45-2.36l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.75 9.75 0 0 0 12 21.99z"/><path fill="#FBBC05" d="M6.54 14.08A5.86 5.86 0 0 1 6.23 12c0-.72.12-1.42.31-2.08V7.4H3.3A9.99 9.99 0 0 0 2.25 12c0 1.61.39 3.14 1.05 4.6l3.24-2.52z"/><path fill="#EA4335" d="M12 5.89c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 2.92 14.63 2 12 2a9.75 9.75 0 0 0-8.7 5.4l3.24 2.52C7.31 7.61 9.46 5.89 12 5.89z"/></svg>
    Continue with Google
  </button>

  <div class="status" id="status"></div>
  <div class="referral-box" role="note" aria-label="Free pass instructions">
    <div class="referral-icon">✦</div>
    <div class="referral-title">FREE PASS • PREMIUM ACCESS</div>
    <p>JOIN OUR TELEGRAM CHANNEL TO GET YOUR REFERRAL CODE.</p>
    <a class="telegram-cta" href="tg://resolve?domain=MOCK_TEST18" aria-label="Enter to Premium on Telegram">✈ &nbsp; ENTER TO PREMIUM</a>
    <div class="referral-glow">✧ &nbsp; JOIN TELEGRAM &nbsp; ✧</div>
  </div>
</section>

<script>
let supa=null;
function getSupa(){
  if(supa)return supa;
  const c=window.STUDY_NOTES_SUPABASE||{};
  if(!window.supabase||!c.url||!c.key)throw Error('Supabase configuration is missing.');
  return supa=window.supabase.createClient(c.url,c.key);
}
function status(t,bad=false){
  const e=document.getElementById('status');e.textContent=t||'';e.style.color=bad?'#ff9b9b':'#9ba6bb';
}
document.getElementById('googleBtn').onclick=async()=>{
  const btn=document.getElementById('googleBtn');btn.disabled=true;status('Connecting to Google…');
  try{
    const {error}=await getSupa().auth.signInWithOAuth({provider:'google',options:{redirectTo:new URL('index.html',location.href).href}});
    if(error)throw error;
  }catch(err){status(err?.message||'Google login is not enabled in Supabase yet.',true);btn.disabled=false;}
};
(async()=>{try{const {data}=await getSupa().auth.getSession();if(data.session)location.href='index.html'}catch(e){status('Supabase configuration could not be loaded.',true)}})();
</script>
</body>
</html>
