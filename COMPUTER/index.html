<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HSSC PYQ COMPUTER • Select Folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:13px 10px;background:#f3f6fb;color:#172033;
  font-family:'Poppins',sans-serif;
}
.wrap{max-width:900px;margin:auto}
.top-actions{display:flex;justify-content:flex-end;gap:9px;margin:7px 8px 9px}
.top-actions button{
  width:68px;height:54px;border:0;border-radius:17px;background:#fff;
  color:#172033;font-size:27px;box-shadow:0 4px 12px #14233c18;cursor:pointer;
}
.top-actions button:active{transform:scale(.96)}
.heading{
  margin:8px 10px 15px;font-family:'Baloo 2',sans-serif;font-size:31px;
  line-height:1.05;font-weight:800;display:flex;align-items:center;gap:10px;
}
.heading .emoji{font-size:30px}
#status{color:#687386;font-size:15px;margin:0 10px 12px}
.grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.card{
  min-height:205px;border:2px solid #b8c2ce;border-radius:23px;padding:16px 14px;
  text-decoration:none;color:#172033;position:relative;cursor:pointer;
  box-shadow:0 6px 16px #14233c12;transition:.15s;
  display:flex;flex-direction:column;
}
.card:active{transform:scale(.985)}
.card:nth-child(6n+1){background:#dceeed}
.card:nth-child(6n+2){background:#dedfec}
.card:nth-child(6n+3){background:#dce9d5}
.card:nth-child(6n+4){background:#e3d8e7}
.card:nth-child(6n+5){background:#d9e8ee}
.card:nth-child(6n+6){background:#e5dfd2}
.icon-box{
  width:90px;height:90px;border-radius:22px;background:#eef7f7cc;
  border:1px solid #d0e2e4;display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
.svg{width:57px;height:57px}
.shape{fill:none;stroke:#4c8082;stroke-width:4.8;stroke-linecap:round;stroke-linejoin:round}
.doc-shape{fill:none;stroke:#4c8082;stroke-width:3.7;stroke-linecap:round;stroke-linejoin:round}
.title{
  font-family:'Poppins',sans-serif;font-size:20px;line-height:1.16;
  font-weight:800;word-break:break-word;padding-right:22px;
}
.file{
  margin-top:7px;color:#727d89;font-size:13px;line-height:1.35;
  word-break:break-word;padding-right:5px;
}
.arrow{
  position:absolute;right:17px;top:60px;color:#68727d;font-size:36px;line-height:1;
}
.note{
  margin:18px 10px 4px;text-align:center;color:#68778a;font-size:15px;line-height:1.5
}
.empty{
  grid-column:1/-1;background:#fff;padding:22px;border-radius:18px;
  color:#687386;text-align:center
}
.viewer{
  display:none;position:fixed;inset:0;background:#fff;z-index:9999
}
.viewerbar{
  height:54px;background:#166534;color:#fff;display:flex;align-items:center;
  gap:9px;padding:7px 10px
}
.viewerbar button{
  border:0;border-radius:10px;background:#ffffff22;color:#fff;
  padding:9px 12px;font-size:16px;cursor:pointer
}
.viewerbar span{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700
}
iframe{width:100%;height:calc(100vh - 54px);border:0}
body.dark{background:#111827;color:#e5e7eb}
body.dark .top-actions button{background:#1f2937;color:#fff}
body.dark .card{border-color:#344154}
body.dark .card:nth-child(6n+1){background:#294247}
body.dark .card:nth-child(6n+2){background:#35394a}
body.dark .card:nth-child(6n+3){background:#334335}
body.dark .card:nth-child(6n+4){background:#403846}
body.dark .card:nth-child(6n+5){background:#293b42}
body.dark .card:nth-child(6n+6){background:#413d34}
body.dark .icon-box{background:#26343d;border-color:#3a4b54}
body.dark .file,.dark .note{color:#aab3c2}
body.dark .empty{background:#1f2937;color:#aab3c2}
@media(max-width:600px){
  .top-actions{margin:5px 7px 8px}
  .heading{font-size:30px;margin:7px 10px 15px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-height:190px;padding:14px 12px;border-radius:21px}
  .icon-box{width:82px;height:82px;border-radius:21px;margin-bottom:15px}
  .svg{width:53px;height:53px}
  .title{font-size:17px}
  .file{font-size:12px}
  .arrow{right:12px;top:53px;font-size:33px}
  .note{font-size:14px;margin-top:16px}
}
</style>
</head>
<body>
<div class="wrap">

<div class="top-actions">
  <button onclick="toggleDark()" title="Dark Mode">🌙</button>
  <button onclick="fullScreen()" title="Full Screen">⛶</button>
</div>

<h1 class="heading"><span class="emoji">📁</span><span>Select Folder</span></h1>
<div id="status">Loading...</div>
<div id="items" class="grid"></div>
<div class="note">Folder खोलकर अपने HTML Tests / Parts से Practice शुरू करें।</div>

</div>

<div id="viewer" class="viewer">
  <div class="viewerbar">
    <button onclick="closeTest()">← Tests</button>
    <span id="viewerTitle">Test</span>
    <button onclick="fullScreen()">⛶</button>
  </div>
  <iframe id="frame" allowfullscreen></iframe>
</div>

<script>
const OWNER="Golu171";
const REPO="study-notes";
const ROOT="COMPUTER";
const BRANCH="main";

let currentPath=ROOT;
let folders=[];
let files=[];

function api(path){
  return "https://api.github.com/repos/"+OWNER+"/"+REPO+"/contents/"+
    path.split("/").map(encodeURIComponent).join("/")+"?ref="+BRANCH;
}
function clean(name){
  return name.replace(/\.html$/i,"").replace(/[_-]+/g," ")
    .replace(/\s+/g," ").trim();
}
function esc(text){
  const d=document.createElement("div");d.textContent=text;return d.innerHTML;
}
function sortName(a,b){
  return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:"base"});
}
function folderIcon(){
 return `<svg class="svg" viewBox="0 0 80 80">
   <path class="shape" d="M10 25 Q10 18 17 18 H31 Q36 18 40 23 L43 27 H63 Q70 27 70 34 V59 Q70 66 63 66 H17 Q10 66 10 59 Z"/>
   <path class="shape" d="M11 30 H63"/>
 </svg>`;
}
function docIcon(){
 return `<svg class="svg" viewBox="0 0 80 80">
   <path class="doc-shape" d="M22 10 H48 L60 22 V68 H22 Z"/>
   <path class="doc-shape" d="M48 10 V23 H60"/>
   <path class="doc-shape" d="M30 34 H51 M30 44 H51 M30 54 H46"/>
 </svg>`;
}
function cardIcon(type){return type==="dir"?folderIcon():docIcon()}

function render(){
 const box=document.getElementById("items");
 box.innerHTML="";
 folders.forEach(item=>{
   const a=document.createElement("a");
   a.className="card";
   const p=item.path.split("/").map(encodeURIComponent).join("/");
   a.href="/"+REPO+"/"+p+"/";
   a.innerHTML=`<div class="icon-box">${cardIcon("dir")}</div>
     <div class="title">${esc(clean(item.name))}</div>
     <div class="file">Folder • HTML Tests / Parts</div><div class="arrow">›</div>`;
   box.appendChild(a);
 });
 files.forEach(file=>{
   const d=document.createElement("div");
   d.className="card";
   d.onclick=()=>openTest(file);
   d.innerHTML=`<div class="icon-box">${cardIcon("file")}</div>
     <div class="title">${esc(clean(file.name))}</div>
     <div class="file">${esc(file.name)}</div><div class="arrow">›</div>`;
   box.appendChild(d);
 });
 if(!folders.length && !files.length)
   box.innerHTML='<div class="empty">अभी कोई HTML Test या Folder नहीं मिला।</div>';
}

async function load(){
 try{
   const r=await fetch(api(currentPath),{headers:{"Accept":"application/vnd.github+json"}});
   if(!r.ok) throw new Error("GitHub API Error");
   const data=await r.json();
   folders=data.filter(x=>x.type==="dir").sort(sortName);
   files=data.filter(x=>x.type==="file" && /\.html$/i.test(x.name)
     && x.name.toLowerCase()!=="index.html").sort(sortName);
   const name=currentPath.split("/").pop();
   document.getElementById("status").textContent=
     folders.length+" Folder"+(folders.length===1?"":"s")+" + "+
     files.length+" HTML Test"+(files.length===1?"":"s")+" मिले";
   render();
 }catch(e){
   document.getElementById("status").textContent="Files load नहीं हो पाईं";
   document.getElementById("items").innerHTML=
     '<div class="empty">Internet check करके page फिर खोलें।</div>';
 }
}

function openTest(file){
 const p=file.path.split("/").map(encodeURIComponent).join("/");
 document.getElementById("frame").src="/"+REPO+"/"+p;
 document.getElementById("viewerTitle").textContent=clean(file.name);
 document.getElementById("viewer").style.display="block";
}
function closeTest(){
 document.getElementById("viewer").style.display="none";
 document.getElementById("frame").src="";
}
function fullScreen(){
 if(!document.fullscreenElement){
   document.documentElement.requestFullscreen?.().catch(()=>{});
 }else{
   document.exitFullscreen?.().catch(()=>{});
 }
}
function toggleDark(){
 document.body.classList.toggle("dark");
 localStorage.setItem("darkMode",
   document.body.classList.contains("dark")?"1":"0");
}
if(localStorage.getItem("darkMode")==="1") document.body.classList.add("dark");

const params=new URLSearchParams(location.search);
const requested=params.get("folder");
if(requested && requested.startsWith(ROOT+"/")) currentPath=requested;

load();
</script>
</body>
</html>
