<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Study Notes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:12px;
  background:#f3f6fb;
  color:#172033;
  font-family:'Poppins',sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
}


/* =========================
   TOP GREEN BOX
========================= */

.top{
  background:linear-gradient(135deg,#285f63,#16484d);
  color:#fff;
  border-radius:22px;
  padding:14px 16px 13px;
  text-align:center;
  box-shadow:0 7px 18px #0002;
}


/* MAIN TITLE */

.main-title{
  margin:0;
  font-family:'Baloo 2',sans-serif;
  font-size:29px;
  line-height:1.05;
  font-weight:800;
  color:#fff;
  text-shadow:0 2px 2px #0003;
}


/* SITE NAME */

.site-name{
  margin-top:1px;
  font-family:'Poppins',sans-serif;
  font-size:29px;
  line-height:1;
  font-weight:800;
  letter-spacing:1.5px;
  color:#f5c84c;
  text-shadow:0 2px 3px #0004;
}


/* CREDIT */

.credit{
  margin-top:6px;
  font-family:'Poppins',sans-serif;
  font-size:11px;
  line-height:1.2;
  font-weight:600;
  color:#dce8e8;
}


/* BUTTONS */

.buttons{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:8px;
}

button{
  border:0;
  background:#f7f8f8;
  color:#33484a;
  width:48px;
  height:40px;
  border-radius:14px;
  font-size:21px;
  cursor:pointer;
  box-shadow:0 3px 8px #0002;
}

button:active{
  transform:scale(.95);
}


/* =========================
   FOLDERS — APP STYLE
========================= */

.heading{
  margin:28px 2px 13px;
  padding-left:14px;
  position:relative;
  font-family:'Baloo 2',sans-serif;
  font-size:25px;
  line-height:1;
  font-weight:800;
  color:#596276;
}

.heading::before{
  content:"";
  position:absolute;
  left:0;
  top:1px;
  width:5px;
  height:24px;
  border-radius:6px;
  background:#4c8f92;
}

#status{
  display:none;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

/* Screenshot-style folder card */
.folder{
  position:relative;
  min-width:0;
  min-height:150px;
  padding:22px 16px 15px;
  border-radius:22px;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:flex-start;
  text-decoration:none;
  color:#1d2434;
  border:1.5px solid rgba(93,112,130,.32);
  box-shadow:0 3px 9px rgba(48,61,80,.08);
  overflow:hidden;
  transition:transform .14s ease, box-shadow .14s ease;
}

.folder:nth-child(6n+1){background:#d9e8e9;}
.folder:nth-child(6n+2){background:#d9dce8;}
.folder:nth-child(6n+3){background:#d5e8df;}
.folder:nth-child(6n+4){background:#ddd9eb;}
.folder:nth-child(6n+5){background:#dce9d7;}
.folder:nth-child(6n+6){background:#e0d6e5;}

.folder:active{
  transform:scale(.975);
  box-shadow:0 2px 6px rgba(48,61,80,.12);
}

.folder-icon{
  width:54px;
  height:54px;
  min-width:54px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(73,110,120,.13);
  box-shadow:none;
  margin-bottom:14px;
  position:relative;
}

/* Category icon container — each folder gets its own logo */
.folder-icon{
  color:#3d7377;
}

.real-book-logo{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  font-size:32px;
  line-height:1;
  display:block;
}

.folder-icon svg{
  width:34px;
  height:34px;
  display:block;
  stroke:currentColor;
  fill:none;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

body.dark .folder-icon{
  color:#b8d5d6;
}

/* MOBILE */
@media(max-width:600px){
  body{
    padding:10px;
  }

  .top{
    padding:13px 12px 12px;
    border-radius:20px;
  }

  .main-title{
    font-size:27px;
  }

  .site-name{
    font-size:26px;
    letter-spacing:1.2px;
  }

  .credit{
    margin-top:4px;
    font-size:10px;
  }

  .buttons{
    margin-top:7px;
  }

  button{
    width:45px;
    height:38px;
    border-radius:13px;
    font-size:20px;
  }

  .heading{
    margin-top:29px;
    margin-bottom:13px;
    font-size:25px;
  }

  .heading::before{
    height:23px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:11px;
  }

  .folder{
    min-height:148px;
    padding:18px 14px 14px;
    border-radius:20px;
  }

  .folder-icon{
    width:50px;
    height:50px;
    min-width:50px;
    border-radius:16px;
    margin-bottom:13px;
  }

  .folder-icon::before{
    left:12px;
    top:19px;
  }

  .folder-icon::after{
    left:14px;
    top:14px;
  }

  .folder-name{
    font-size:16px;
  }

  .arrow{
    right:10px;
    top:9px;
  }
}

</style>

</head>


<body>


<div class="wrap">


<!-- =========================
     TOP
========================= -->

<div class="top">

  <h1 class="main-title">
    जय बजरंग बली
  </h1>

  <div class="site-name">STUDY NOTES</div>


  <div class="credit">
    Made by Sandeep Sheoran<br>
    Dedicated to Golu on his Birthday 🎂
  </div>


  <div class="buttons">

    <button
      onclick="toggleDark()"
      title="Dark Mode">
      🌙
    </button>


    <button
      onclick="fullScreen()"
      title="Full Screen">
      ⛶
    </button>

  </div>

</div>


<!-- =========================
     FOLDERS
========================= -->

<h2 class="heading">अभ्यास</h2>


<div id="status">
  Folders load हो रहे हैं...
</div>


<div id="folders"
     class="grid">
</div>


</div>


<script>


/* =================================
   GITHUB SETTINGS
================================= */

const OWNER = "Golu171";

const REPO = "study-notes";

const BRANCH = "main";


/* =================================
   GITHUB ROOT API
================================= */

const API =
  "https://api.github.com/repos/"
  + OWNER
  + "/"
  + REPO
  + "/contents/?ref="
  + BRANCH;


/* =================================
   CLEAN NAME
================================= */

function cleanName(name){

  return name
    .replace(/[_-]+/g," ")
    .replace(/\s+/g," ")
    .trim();

}


/* =================================
   SAFE TEXT
================================= */

function esc(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


/* =================================
   SORT
================================= */

function sortFolders(a,b){

  return a.name.localeCompare(
    b.name,
    undefined,
    {
      numeric:true,
      sensitivity:"base"
    }
  );

}


/* =================================
   LOAD ROOT FOLDERS
================================= */

async function loadFolders(){

  try{

    const response =
      await fetch(
        API,
        {
          headers:{
            "Accept":
            "application/vnd.github+json"
          }
        }
      );


    if(!response.ok){

      throw new Error(
        "GitHub API Error"
      );

    }


    const data =
      await response.json();


    const folders =
      data
        .filter(
          item =>
            item.type === "dir"
        )
        .sort(sortFolders);


    renderFolders(folders);

  }


  catch(error){

    console.error(error);


    document
      .getElementById("status")
      .textContent =
        "Folders load नहीं हो पाए";


    document
      .getElementById("folders")
      .innerHTML =
        '<div class="empty">' +
        'GitHub Pages पर page खोलें और फिर refresh करें।' +
        '</div>';

  }

}


/* =================================
   SHOW FOLDERS
================================= */

function renderFolders(folders){

  const box =
    document.getElementById("folders");


  box.innerHTML = "";


  document
    .getElementById("status")
    .textContent =
      folders.length
      + " Folder"
      + (
          folders.length === 1
          ? ""
          : "s"
        )
      + " मिले";


  folders.forEach((folder, i) => {

    const a =
      document.createElement("a");


    a.className =
      "folder";


    /* EXACT PATH */

    a.href =
      location.origin +
      "/" +
      REPO +
      "/" +
      folder.path
        .split("/")
        .map(
          part =>
            encodeURIComponent(part)
        )
        .join("/")
      +
      "/";


    a.innerHTML =

      '<div class="folder-icon" aria-hidden="true">' +
      getIcon(folder.name, i) +
      '</div>' +

      '<div class="folder-content">' +

      '<div class="folder-name">' +
      esc(
        cleanName(folder.name)
      ) +
      '</div>' +

      '' +

      '</div>' +

      '';


    box.appendChild(a);

  });


  if(!folders.length){

    box.innerHTML =
      '<div class="empty">' +
      'अभी कोई folder नहीं मिला।' +
      '</div>';

  }

}


/* =================================
   CATEGORY ICONS
================================= */

function getIcon(name, index = 0){

  const n = name.toLowerCase().replace(/[_-]+/g," ").trim();

  /* English — open book */
  if(n === "english" || n.includes("english")){
    return '<span class="real-book-logo" aria-hidden="true">📕</span>';
  }

  /* Haryana GK — map/location */
  if(n.includes("haryana")){
    return `
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 43s13-12.2 13-23A13 13 0 1 0 11 20c0 10.8 13 23 13 23z"/>
        <circle cx="24" cy="20" r="4.5"/>
        <path d="M17 31c4-2 10-2 14 0"/>
      </svg>`;
  }

  /* National / PYQ — stack of papers */
  if(n.includes("national") || n.includes("pyq")){
    return `
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect x="11" y="9" width="25" height="30" rx="3"/>
        <path d="M17 15h13M17 21h13M17 27h9"/>
        <path d="M36 15h3a2 2 0 0 1 2 2v22a2 2 0 0 1-2 2H18"/>
      </svg>`;
  }

  /* HSSC — certificate/badge */
  if(n.includes("hssc")){
    return `
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 7l5 3 6-.2 1.8 5.7 4.7 3.8-2.5 5.5 1 6-5.5 2.3-3 5.2-6-1.2-6 1.2-3-5.2-5.5-2.3 1-6-2.5-5.5 4.7-3.8L18 9.8z"/>
        <path d="M17 21l4.5 4.5L31 16"/>
      </svg>`;
  }

  /* Any NEW folder automatically gets a suitable study icon */
  const icons = [
    `<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="12" width="30" height="25" rx="4"/><path d="M15 12V9h18v3M15 19h18M15 25h13M15 31h9"/></svg>`,
    `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 11h28v27H10z"/><path d="M16 17h16M16 23h16M16 29h10"/></svg>`,
    `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 9h19l7 7v23H12z"/><path d="M30 9v8h8M17 23h16M17 29h12"/></svg>`,
    `<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15"/><path d="M17 24l5 5 10-11"/></svg>`
  ];
  return icons[index % icons.length];
}


/* =================================
   DARK MODE
================================= */

function toggleDark(){

  document
    .body
    .classList
    .toggle("dark");


  localStorage.setItem(
    "darkMode",

    document.body.classList.contains(
      "dark"
    )
      ? "1"
      : "0"
  );

}


/* =================================
   REMEMBER DARK MODE
================================= */

if(
  localStorage.getItem(
    "darkMode"
  ) === "1"
){

  document
    .body
    .classList
    .add("dark");

}


/* =================================
   FULL SCREEN
================================= */

function fullScreen(){

  if(
    !document.fullscreenElement
  ){

    document
      .documentElement
      .requestFullscreen?.()
      .catch(
        ()=>{}
      );

  }

  else{

    document
      .exitFullscreen?.()
      .catch(
        ()=>{}
      );

  }

}


/* =================================
   START
================================= */

loadFolders();

</script>


</body>
  </html>
