<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Notes</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f6fa;
  color:#172033;
}
.container{max-width:900px;margin:auto;padding:22px 18px 45px}
.hero{
  background:#126b38;
  color:white;
  border-radius:30px;
  padding:26px 22px 28px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  margin-bottom:24px;
}
.hero .jai{
  color:#ef4141;
  font-size:32px;
  font-weight:800;
  margin-bottom:24px;
}
.hero .made{
  color:#ef4141;
  font-size:21px;
  font-weight:800;
  line-height:1.45;
}
.section-title{
  font-size:25px;
  font-weight:800;
  margin:10px 0 18px;
}
.folder{
  display:flex;
  align-items:center;
  gap:14px;
  background:white;
  border:1px solid #e1e6ed;
  border-radius:22px;
  padding:18px 18px;
  margin:16px 0;
  text-decoration:none;
  color:#172033;
  box-shadow:0 5px 18px rgba(0,0,0,.07);
}
.folder-icon{font-size:28px}
.folder h2{margin:0 0 6px;font-size:20px}
.folder p{margin:0;color:#687386;font-size:14px}
.arrow{margin-left:auto;font-size:22px;color:#4b3dcc}
.subfolders{
  margin-left:35px;
  margin-top:8px;
}
@media(max-width:600px){
 .container{padding:18px 16px 35px}
 .hero{border-radius:28px;padding:24px 14px 26px}
 .hero .jai{font-size:29px;margin-bottom:17px}
 .hero .made{font-size:21px}
 .section-title{font-size:25px}
 .folder h2{font-size:20px}
 .folder{padding:17px 15px}
}
</style>

<style>
.folder-icon{width:46px;min-width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:31px}
.folder-card{}
</style>

<style>
.hero{
  position:relative;
  background:linear-gradient(145deg,#176d3d,#106334);
  border-radius:30px;
  padding:27px 24px 30px;
  text-align:center;
  min-height:245px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  box-shadow:0 10px 28px rgba(0,0,0,.12);
}
.hero-title{
  color:#f04444;
  font-size:36px;
  font-weight:800;
  line-height:1.2;
  margin-bottom:25px;
}
.hero-credit{
  color:#f04444;
  font-size:25px;
  font-weight:800;
  line-height:1.45;
}
.hero-controls{
  position:absolute;
  right:18px;
  bottom:16px;
  display:flex;
  gap:12px;
}
.control-btn{
  width:68px;
  height:58px;
  border:2px solid #d9dfe5;
  border-radius:17px;
  background:#fff;
  color:#4038b8;
  font-size:29px;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}
.control-btn:active{transform:scale(.96)}
body.dark{
  background:#111827;
  color:#f3f4f6;
}
body.dark .folder,
body.dark .folders-section h2{color:#f3f4f6}
body.dark .folder{background:#1f2937;border-color:#374151}
body.dark .folder p{color:#cbd5e1}
body.dark .control-btn{background:#1f2937;color:#facc15;border-color:#4b5563}
@media(max-width:600px){
  .hero{
    min-height:285px;
    border-radius:28px;
    padding:25px 16px 72px;
  }
  .hero-title{font-size:32px;margin-bottom:25px}
  .hero-credit{font-size:23px}
  .hero-controls{
    right:17px;
    bottom:15px;
    gap:11px;
  }
  .control-btn{
    width:64px;
    height:56px;
    font-size:27px;
  }
}
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <div class="hero-title">जय बजरंग बली</div>
    <div class="hero-credit">Made by Sandeep Sheoran<br>Dedicated to Golu</div>
    <div class="hero-controls">
      <button id="themeBtn" class="control-btn" aria-label="Dark mode">🌙</button>
      <button id="fullBtn" class="control-btn" aria-label="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="section-title">📁 Folders</div>

  <a class="folder" href="HARYANA-GK/">
    <div class="folder-icon">📁</div>
    <div>
      <h2>HARYANA GK</h2>
      <p>Haryana GK के सभी HTML Tests यहाँ मिलेंगे</p>
    </div>
    <div class="arrow">→</div>
  </a>

  <a class="folder" href="ENGLISH/">
    <div class="folder-icon">📁</div>
    <div>
      <h2>ENGLISH</h2>
      <p>Black Book और Volume 1</p>
    </div>
    <div class="arrow">→</div>
  </a>

</div>

<script>
(function(){
  const themeBtn = document.getElementById('themeBtn');
  const fullBtn = document.getElementById('fullBtn');

  if(localStorage.getItem('study-theme') === 'dark'){
    document.body.classList.add('dark');
    themeBtn.textContent = '☀️';
  }

  themeBtn.addEventListener('click', function(){
    document.body.classList.toggle('dark');
    const dark = document.body.classList.contains('dark');
    themeBtn.textContent = dark ? '☀️' : '🌙';
    localStorage.setItem('study-theme', dark ? 'dark' : 'light');
  });

  fullBtn.addEventListener('click', function(){
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen?.();
    }else{
      document.exitFullscreen?.();
    }
  });
})();
</script>
</body>
</html>

<style>
@media(max-width:600px){
  .folder{
    min-height:78px;
    padding:14px 14px;
    border-radius:17px;
    gap:11px;
    margin:11px 0;
  }
  .folder-icon{
    width:40px;
    min-width:40px;
    height:40px;
    font-size:27px;
  }
  .folder h2{font-size:20px;margin-bottom:3px}
  .folder p{font-size:13px;line-height:1.35}
  .arrow{font-size:21px}
}
</style>
