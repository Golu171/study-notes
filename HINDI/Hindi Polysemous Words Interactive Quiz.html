    // Helper: Extract a key distinct phrase from explanation for the correct choice
    function getPrimaryMeaning(exp) {
      let parts = exp.split(/[।;,]/).map(s => s.trim()).filter(s => s.length > 0 && !s.startsWith("जैसे"));
      if (parts.length >= 2) {
        return parts.slice(0, 2).join(", ");
      }
      return parts[0] || exp;
    }

    // Generate intelligent distractors from other words in the list
    const questions = rawData.map((item, index) => {
      const correctMeaning = getPrimaryMeaning(item.exp);
      
      // Get 3 plausible distractors from other entries
      const distractors = [];
      const usedIndexes = new Set([index]);
      
      let attempts = 0;
      while (distractors.length < 3 && attempts < 200) {
        attempts++;
        const randIdx = Math.floor(Math.random() * rawData.length);
        if (!usedIndexes.has(randIdx)) {
          usedIndexes.add(randIdx);
          const distractor = getPrimaryMeaning(rawData[randIdx].exp);
          if (distractor !== correctMeaning && !distractors.includes(distractor)) {
            distractors.push(distractor);
          }
        }
      }

      // Shuffle options and record correct index
      const options = [correctMeaning, ...distractors];
      for (let i = options.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [options[i], options[j]] = [options[j], options[i]];
      }
      const correctIndex = options.indexOf(correctMeaning);

      return {
        id: item.id,
        word: item.word,
        fullExplanation: item.exp,
        correctMeaning: correctMeaning,
        options: options,
        correctIndex: correctIndex,
        userSelectedIndex: null,
        isExplanationVisible: false
      };
    });

    let correctCount = 0;
    let wrongCount = 0;
    let attemptedCount = 0;

    function renderQuiz() {
      const container = document.getElementById('quizContainer');
      let html = '';

      questions.forEach((q, qIdx) => {
        html += `
          <article id="qCard-${q.id}" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 sm:p-6 shadow-sm transition-all hover:shadow-md">
            <!-- Question Header -->
            <div class="flex items-start justify-between gap-4 mb-4">
              <div class="flex items-center gap-3">
                <span class="w-8 h-8 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 flex items-center justify-center font-bold text-sm">
                  ${q.id}
                </span>
                <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">

                </h2>
              </div>
              <span id="badge-${q.id}" class="hidden text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap"></span>
            </div>

            <!-- 4 Options Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-2" id="optContainer-${q.id}">
              ${q.options.map((opt, optIdx) => `
                <button
                  type="button"
                  id="btn-${q.id}-${optIdx}"
                  onclick="handleOptionClick(${qIdx}, ${optIdx})"
                  class="option-btn text-left p-3.5 rounded-xl border border-slate-200 dark:border-slate-750 bg-slate-50/50 dark:bg-slate-800/40 text-slate-800 dark:text-white font-medium text-sm transition-all duration-150 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-start gap-2.5 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-indigo-500/50"
                >
                  <span class="w-6 h-6 rounded-md bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-100 flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                    ${['A', 'B', 'C', 'D'][optIdx]}
                  </span>
                  <span class="flex-1 text-slate-800 dark:text-white leading-relaxed">${opt}</span>
                </button>
              `).join('')}
            </div>

            <!-- Explanation Box (Initially Hidden) -->
            <div id="expBox-${q.id}" class="hidden mt-4 pt-4 border-t border-slate-100 dark:border-slate-800">
              <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800/60 border-l-4 border-indigo-500 text-sm">
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-1.5 font-bold text-indigo-700 dark:text-indigo-300">

                      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                    </svg>
                    <span>सम्पूर्ण व्याख्या (पुस्तक अनुसार सभी अर्थ):</span>
                  </div>
                  <span class="text-xs text-slate-400 dark:text-slate-300 italic">(विकल्प पर पुनः क्लिक करके छिपाएं/दिखाएं)</span>
                </div>
                <div class="text-slate-700 dark:text-slate-100 leading-relaxed font-normal">

      container.innerHTML = html;

    function handleOptionClick(qIdx, optIdx) {
      const q = questions[qIdx];
      const expBox = document.getElementById(`expBox-${q.id}`);
      const badge = document.getElementById(`badge-${q.id}`);

      // First time answering this question
      if (q.userSelectedIndex === null) {
        q.userSelectedIndex = optIdx;
        attemptedCount++;

        const isCorrect = (optIdx === q.correctIndex);
        if (isCorrect) {
          correctCount++;
        } else {
          wrongCount++;
        }

        // Update score indicators
        updateScoreBoard();

        // Highlight options
        highlightOptions(q, optIdx);

        // Show badge
        badge.classList.remove('hidden');
        if (isCorrect) {
          badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap bg-emerald-100 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800';
          badge.textContent = '✓ सही उत्तर';
        } else {
          badge.className = 'text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap bg-rose-100 dark:bg-rose-950/80 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800';
          badge.textContent = '✕ गलत उत्तर';
        }

        // Open explanation on first attempt
        expBox.classList.remove('hidden');
        q.isExplanationVisible = true;
      } 
      // If clicking again on any option
      else {
        // Toggle explanation visibility
        if (q.isExplanationVisible) {
          expBox.classList.add('hidden');
          q.isExplanationVisible = false;
          showToast(`प्रश्न ${q.id} की व्याख्या छिपाई गई`);
        } else {
          expBox.classList.remove('hidden');
          q.isExplanationVisible = true;
          showToast(`प्रश्न ${q.id} की व्याख्या खोली गई`);
        }
      }
    }

    // Highlight Buttons correctly
    function highlightOptions(q, selectedIdx) {
      q.options.forEach((_, idx) => {
        const btn = document.getElementById(`btn-${q.id}-${idx}`);
        const badgeSpan = btn.querySelector('span:first-child');
        
        if (idx === q.correctIndex) {
          // Correct button styling
          btn.className = 'option-btn text-left p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-900 dark:text-white font-medium text-sm transition-all flex items-start gap-2.5';
          badgeSpan.className = 'w-6 h-6 rounded-md bg-emerald-600 text-white flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5';
          badgeSpan.innerHTML = '✓';
        } else if (idx === selectedIdx && selectedIdx !== q.correctIndex) {
          // Wrong button selected styling
          btn.className = 'option-btn text-left p-3.5 rounded-xl border-2 border-rose-500 bg-rose-50/80 dark:bg-rose-950/40 text-rose-900 dark:text-white font-medium text-sm transition-all flex items-start gap-2.5';
          badgeSpan.className = 'w-6 h-6 rounded-md bg-rose-600 text-white flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5';
          badgeSpan.innerHTML = '✕';
        } else {
          // Other inactive buttons
          btn.className = 'option-btn text-left p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/30 dark:bg-slate-900/30 text-slate-400 dark:text-slate-400 text-sm opacity-60 cursor-pointer flex items-start gap-2.5';
        }
      });
    }

    // Update Header Scores
    function updateScoreBoard() {
      document.getElementById('headerCorrect').textContent = `सही: ${correctCount}`;
      document.getElementById('headerWrong').textContent = `गलत: ${wrongCount}`;
      document.getElementById('headerAttempted').textContent = `हल: ${attemptedCount}/${questions.length}`;

      const pct = (attemptedCount / questions.length) * 100;
      document.getElementById('quizProgressBar').style.width = `${pct}%`;
    }

    // Reset All Questions
    function resetAllQuiz() {
      if (!confirm("क्या आप पूरी परीक्षा को रीसेट करना चाहते हैं?")) return;
      correctCount = 0;
      wrongCount = 0;
      attemptedCount = 0;
      questions.forEach(q => {
        q.userSelectedIndex = null;
        q.isExplanationVisible = false;
      });
      renderQuiz();
      updateScoreBoard();
      showToast("सभी प्रश्न रीसेट कर दिए गए हैं।");
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      const isDark = html.classList.toggle('dark');
      const sunIcon = document.getElementById('sunIcon');
      const moonIcon = document.getElementById('moonIcon');
      const themeText = document.getElementById('themeText');

      if (isDark) {
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        themeText.textContent = 'लाइट मोड';
        localStorage.setItem('pref-theme', 'dark');
        showToast("डार्क मोड सक्रिय (सफेद टेक्स्ट)");
      } else {
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        themeText.textContent = 'डार्क मोड';
        localStorage.setItem('pref-theme', 'light');
        showToast("लाइट मोड सक्रिय");
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          showToast("फुल स्क्रीन मोड चालू");
        }).catch(() => {
          showToast("फुल स्क्रीन उपलब्ध नहीं है");
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            showToast("फुल स्क्रीन बंद");
          });
        }
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toastBox');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-20', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-20', 'pointer-events-none');
      }, 2000);
    }

    window.onload = function() {
      // Check for theme preferences
      if (localStorage.getItem('pref-theme') === 'dark' || 
          (!localStorage.getItem('pref-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('sunIcon').classList.remove('hidden');
        document.getElementById('moonIcon').classList.add('hidden');
        document.getElementById('themeText').textContent = 'लाइट मोड';
      }

      renderQuiz();
      updateScoreBoard();
    };
  </script>
